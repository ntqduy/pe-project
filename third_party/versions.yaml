schema_version: 2

# Repositories are clean local clones. Their contents are intentionally ignored
# by the parent project; this manifest is the reproducible source of truth.
components:
  ct_fm:
    status: staged
    repo_path: third_party/repos/CT-FM
    repo_url: https://github.com/project-lighter/CT-FM.git
    commit: f58c89a75ff0270ba6e339027e40bf04a221735d
    weight_repo_path: third_party/weights/ct_fm_feature_extractor
    weight_repo_url: https://huggingface.co/project-lighter/ct_fm_feature_extractor
    weight_revision: 527b0d1c262b433396c85ff2de84c427b26945a1
    expected_weight: third_party/weights/ct_fm_feature_extractor/model.safetensors
    checksum_sha256: b521ff13764ad0fce67f8ad2e5aa9ccc0823f69e4544b446581d8a2dee686215
    architecture: monai.networks.nets.segresnet_ds.SegResEncoder(spatial_dims=3, init_filters=32, in_channels=1, blocks_down=(1, 2, 2, 4, 4))
    feature_dim: 512
    note: >-
      upstream publishes no Lighter .ckpt; the only public CT-FM weight is this HuggingFace
      SegResEncoder. Verified by strict load of all 161 tensors and a forward pass returning a
      5-level pyramid whose deepest level has 512 channels. The weight repo is a git clone made
      without git-lfs, so model.safetensors was fetched from the HF resolve endpoint and its
      SHA-256 checked against the LFS pointer oid.

  penet:
    status: staged
    repo_path: third_party/repos/penet
    repo_url: https://github.com/marshuang80/penet.git
    commit: 8de387d
    expected_weight: third_party/weights/penet_best.pth.tar
    checksum_sha256: 891276e2fb085735f0cc39fab0bc9c0cd5ab0ae4ef9aa245e3b17b1d526bc52b
    factory: models.penet_classifier:PENetClassifier
    model_args: {model_depth: 50, cardinality: 32, num_classes: 1, num_channels: 3}
    released_val_auroc: 0.7959827833572454
    # Verified by a strict load of all 225 tensors (the archive stores them DataParallel-
    # prefixed) and a forward pass on the contract shape below.
    input_contract:
      slices_per_window: 32
      window_stride: 32            # windows are non-overlapping
      resize_shape: [224, 224]     # cv2.INTER_AREA, slice-wise
      crop_shape: [208, 208]       # centre crop at test time
      input_channels: 1            # PENetClassifier.forward expands 1 -> 3 itself
      clip_hu: [-100.0, 900.0]
      normalize: "(x - min) / (max - min), clipped to [0,1], then minus 0.15897"
      divide_by_std: false
      pad_value_hu: -1000.0
      series_aggregation: max_sigmoid_over_windows
    note: >-
      Two places where the repository contradicts what a reader would assume, both checked
      by executing the module rather than reading it: ct/ct_pe_constants.py also defines a
      (-250, 450) window, but it sits inside a triple-quoted string and never executes; and
      CONTRAST_HU_STD is defined but never applied, because _normalize_raw only subtracts
      the mean. PENet cannot consume this project's volumes/*.npy cache (1 channel, 1.5 mm
      isotropic, 128^3), so the zero-shot tool reads the raw release NIfTI instead.
  radar:
    status: staged
    repo_path: third_party/repos/damo-radar
    repo_url: https://github.com/alibaba-damo-academy/damo-radar.git
    commit: 0dbf0ece209b77d722588e5e7943014d3db48f7f
    license: CC BY-NC-SA 4.0 (research, non-commercial)
    weight_source: https://huggingface.co/radar-generalist (download_scripts/download_checkpoints.py)
    expected_weight: third_party/repos/damo-radar/ckpt/checkpoint_radar_pretrain.pth
    checksum_sha256: 5e8b1b50b92162fcafcf8231e51ffbe9d1be2be52ccff4f967e4beb71e4499f4
    environment: separate conda env from the repo requirements.txt (transformers==4.25, timm==0.4.12)
    runner: tools/tasks/zeroshot_radar.py -> tools/tasks/zeroshot_radar_worker.py (RADAR env)
    input_contract:
      source: RADAR_inference/inference_demo.py
      orientation: LAS as stored (INSPECT and the demo case); others reoriented to LAS
      resample_mm: [1.0, 1.0, 5.0]
      clip_hu: [-300.0, 400.0]
      normalize: per-volume min-max, crop the non-zero box, pad to 96x256x384
      window: {roi: [96, 256, 384], overlap: 0.25}
      organ: 肺动脉 (pulmonary artery), located by RADAR's own 36-organ segmentation head
      score: softmax([negative, positive] similarity / temperature)[positive]
    note: >-
      Abdominal-CT generalist with no PE finding among its 146 shipped ones, so the PE arm
      scores the pulmonary-artery organ token against radar.prompts (configs/runs/01_foundation/
      radar_zero_shot.yaml). The prompt convention was checked by re-encoding: every shipped
      negative matches the training default caption "normal." (cosine 0.98), and shipped
      positives are unnormalised means of unit sentence embeddings (norm ~0.77). The checkpoint
      loads with only BERT's masked-LM head (cls.predictions, unused for embeddings) missing.
      Smoke check on smoke_30: RADAR segments the main and left pulmonary artery on CTPA; a
      chest-abdomen-pelvis series without a pulmonary artery in view is skipped, not scored.
  ct_clip:
    status: repo_ready_weight_missing_adapter_pending
    repo_path: third_party/repos/CT-CLIP
    import_root: third_party/repos/CT-CLIP/CT_CLIP
    repo_url: https://github.com/ibrahimethemhamamci/CT-CLIP.git
    commit: a2a155c601987820433c01db69b64d701d3d229d
    expected_weight: third_party/weights/foundation/ct_clip/model.pt
    checksum_sha256: null
    note: set factory/output_adapter only after matching the checkpoint architecture

  totalfm:
    status: repo_ready_weight_missing_adapter_pending
    repo_path: third_party/repos/TotalFM
    repo_url: https://github.com/jichi-labo/TotalFM.git
    commit: 3a104a56e87735f209210f34e084fa2eba6aab55
    expected_weight: third_party/weights/foundation/totalfm/totalfm_en_checkpoint_best_loss.pt
    checksum_sha256: null
    note: upstream is organ-patch based and is not assumed to be a drop-in whole-volume encoder

  totalsegmentator:
    status: repo_ready_weights_missing_install_required
    repo_path: third_party/repos/TotalSegmentator
    repo_url: https://github.com/wasserth/TotalSegmentator.git
    commit: 0e65a448d557382b1e925276212b3bec7f5aff83
    describe: v2.18.0-9-g0e65a44
    expected_weight_directory: third_party/weights/segmentation/totalsegmentator
    checksum_sha256: null
    note: primary pseudo-anatomy backend; install the pinned local package and stage its task weights offline

  lungmask:
    status: repo_ready_weight_missing_install_required
    repo_path: third_party/repos/lungmask
    repo_url: https://github.com/JoHof/lungmask.git
    commit: 87fc9f2b701458a6d38f5e64d59a5e60bc68c884
    describe: v0.2.21-4-g87fc9f2
    expected_weight: third_party/weights/segmentation/lungmask/R231.pth
    checksum_sha256: null
    note: independent secondary lung QC only; it never replaces the TotalSegmentator canonical lung mask

  falcon:
    status: weight_staged
    # Verified from the staged directory: config.json declares FalconForCausalLM and the
    # README identifies tiiuae/falcon-7b. The revision is the Hugging Face commit recorded
    # by the downloader in .cache/huggingface/trees/.
    weight_directory: third_party/weights/falcon-7b
    exact_model_id: tiiuae/falcon-7b
    revision: 8782b5c5d8c9290412416618f36a133653e85285
    architectures: [FalconForCausalLM]
    auto_model_class: AutoModelForCausalLM
    tokenizer_class: AutoTokenizer
    weight_files: [model-00001-of-00002.safetensors, model-00002-of-00002.safetensors]
    checksum_sha256: null
    note: >-
      Text-only causal LM; AutoModelForCausalLM + AutoTokenizer is the correct pair.
      Per-shard SHA-256 is still unrecorded; compute it once and pin it here.

  medgemma:
    status: weight_staged
    # Verified from the staged directory: config.json declares Gemma3ForConditionalGeneration
    # with a siglip vision tower, and the README is the MedGemma 1.5 4B multimodal
    # instruction-tuned card (google/medgemma-1.5-4b-it).
    weight_directory: third_party/weights/medgemma
    exact_model_id: google/medgemma-1.5-4b-it
    revision: 91850547d9f0b2fdd21aa7c5f4f3d1a8a52c243b
    architectures: [Gemma3ForConditionalGeneration]
    # NOT AutoModelForCausalLM: this checkpoint is an image-text-to-text model, and
    # AutoModelForCausalLM does not resolve Gemma3ForConditionalGeneration. Report mining
    # is text-only, so the plain text tokenizer is the right input path.
    auto_model_class: AutoModelForImageTextToText
    tokenizer_class: AutoTokenizer
    weight_files: [model-00001-of-00002.safetensors, model-00002-of-00002.safetensors]
    shard_sha256:
      model-00001-of-00002.safetensors: 5e4c75b0ef1fb009caee567ab244f9e354e915fda748d1b76179cc453a39b4b5
      model-00002-of-00002.safetensors: 958e39df78c35ddb812fbcb8b5e7f46e07f1b153c1589f2d3f0b41c3b0748d30
    note: >-
      Gated Health AI Developer Foundations licence. Both shard hashes match the pinned
      Hugging Face download metadata. transformers>=4.57
      is required for the gemma3 model type declared in config.json.
