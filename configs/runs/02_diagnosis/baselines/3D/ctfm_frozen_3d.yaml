# CT-FM 3D frozen (cached pooled features, tools/data/build_ctfm_cache.py) + head.
# Baseline arm of the diagnosis baseline zoo (see scripts/diagnosis/baselines/README.md).
# Contracts: backbone -> components/backbones.yaml#registry.ct_fm_features, head/task/budget ->
# components/baselines.yaml. Effective batch = batch_size x gradient_accumulation = 32.
_base_:
  - ../../../../paths.yaml
  - ../../../../compute/default.yaml
  - ../../../../components/backbones.yaml#registry
  - ../../../../components/encoders.yaml#from_pretrained
  - ../../../../components/baselines.yaml#diagnosis
  - ../../../../components/baselines.yaml#head_mlp
  - ../../../../components/baselines.yaml#train_frozen_features

experiment:
  id: DX_base_ctfm_frozen_3d
  name: baseline.ctfm_frozen_3d
  baseline_backbone: ct_fm_features

model:
  backbone: ct_fm_features

training:
  batch_size: 32
  gradient_accumulation: 1

data:
  # Pooled CT-FM features [513,1,1,1] kept in RAM (see configs/runs/01_foundation/
  # 01_foundation/ct_fm_frozen/diagnosis.yaml); the preview still renders on the full feature grid.
  manifest: manifests/ct_fm/diagnosis.csv
  file_column: pooled_path
  preload_inputs: true
