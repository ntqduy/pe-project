# Swin 3D (Swin-UNETR self-supervised CT weights) + head.
# Baseline arm of the diagnosis baseline zoo (see scripts/diagnosis/baselines/README.md).
# Contracts: backbone -> components/backbones.yaml#registry.swin_3d, head/task/budget ->
# components/baselines.yaml. Effective batch = batch_size x gradient_accumulation = 4.
_base_:
  - ../../../../paths.yaml
  - ../../../../compute/default.yaml
  - ../../../../components/backbones.yaml#registry
  - ../../../../components/encoders.yaml#from_pretrained
  - ../../../../components/baselines.yaml#diagnosis
  - ../../../../components/baselines.yaml#head_mlp
  - ../../../../components/baselines.yaml#train_end_to_end

experiment:
  id: DX_base_swin_3d
  name: baseline.swin_3d
  baseline_backbone: swin_3d

model:
  backbone: swin_3d

training:
  batch_size: 2
  gradient_accumulation: 2
