# prog.spesi — simplified PESI only. The clinical score baseline.
#
# Question: how much 30-day mortality signal is already in the established severity score?
# Any imaging or multimodal arm has to beat this to be worth anything clinically. This is
# the same baseline the INSPECT release reports its own models against.
# No image encoder is built at all (task.modalities has no image), so no backbone is needed.
# Output: outputs/prognosis/PR_spesi_only/score_baseline/ (tools/tasks/score_baseline.py)
_base_:
  - ../../../paths.yaml
  - ../../../compute/default.yaml
  - ../../../components/tasks.yaml#prognosis
  - ../../../components/tasks.yaml#prognosis_primary_cohort
  - ../../../components/training.yaml#prognosis
experiment:
  id: PR_spesi_only
  name: prog.spesi
  stage: prognosis
  family: prognosis
task:
  modalities: [spesi]
  regions: []
lineage:
  backbone: tabular_spesi
  initialization: tabular_random
  source_experiment: null
  source_checkpoint: null
  transfer_modules: []
  supervision_type: native_labels
supervision:
  require_masks: false
  require_ehr: false
  require_spesi: true
  spesi: clinical/spesi_features.csv
peft:
  _replace_: true
  method: full
