# prog.anatomy.late — anatomy-aware image + EHR, late-logit fusion.
#
# Question: with five branches (global, heart, PA, lung, EHR), is averaging branch
# decisions better than concatenating branch features?
# Branch weights are masked and renormalized, so a missing organ mask or a missing clinical
# record removes that branch instead of zeroing it.
# Identical to prog.anatomy.concat except for the fusion component.
# Output: outputs/prognosis/PR_anatomy_late_logit/
_base_:
  - ../../../paths.yaml
  - ../../../compute/default.yaml
  - ../../../components/backbones.yaml#ct_fm
  - ../../../components/encoders.yaml#from_pretrained
  - ../../../components/tasks.yaml#prognosis
  - ../../../components/tasks.yaml#prognosis_primary_cohort
  - ../../../components/training.yaml#prognosis
  - ../../../components/anatomy.yaml#organ_adapter
  - ../../../components/anatomy.yaml#anatomy_masks
  - ../../../components/fusions.yaml#late_logit
experiment:
  id: PR_anatomy_late_logit
  name: prog.anatomy.late
  stage: prognosis
  family: prognosis
task:
  modalities: [image, ehr, spesi]
  regions: [heart, pa, lung]
lineage:
  transfer_modules: [image_encoder]
  supervision_type: native_labels
supervision:
  require_masks: true
  masks: segmentation/SEG_pseudo_anatomy
  require_ehr: true
  require_spesi: true
  spesi: clinical/spesi_features.csv
  ehr: clinical/ehr_features.csv
