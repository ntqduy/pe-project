# Protocol diagnosis multitask: exactly the three reviewed native binary labels.
# The shared matrix launcher overrides only output_id, weight source and dataset profile.
_base_:
  - ../../../paths.yaml
  - ../../../compute/default.yaml
  - ../../../components/backbones.yaml#ct_fm
  - ../../../components/encoders.yaml#from_c0
  - ../../../components/tasks.yaml#diagnosis
  - ../../../components/training.yaml#diagnosis
  - ../../../components/fusions.yaml#concat_mlp
experiment:
  id: DX_matrix_multitask
  name: diag.matrix.multitask
  stage: diagnosis
  family: diagnosis
  variant_stamp: false
data:
  mode: full
  cohort: all_eligible_ctpa
  manifest: manifests/diagnosis.csv
  file_column: image_path
  label_columns: [pe_positive, pe_acute, pe_subsegmental]
  mask_columns: {}
diagnosis:
  mode: multitask
  primary_task: pe_positive
  tasks: [pe_positive, pe_acute, pe_subsegmental]
finetuning:
  strategy: lora
  lora:
    target_modules: [attn, projection]
    rank: 8
    alpha: 16
    dropout: 0.05
task:
  primary_target: pe_positive
  targets:
    _replace_: true
    pe_positive: 1
    pe_acute: 1
    pe_subsegmental: 1
  regions: []
  silver_targets: []
  silver_loss_weight: 0.0
lineage:
  transfer_modules: [image_encoder]
  supervision_type: native_labels
supervision:
  require_masks: false
  masks: null
  require_silver_labels: false
