# diag.global.native_multitask — global image features, native multitask heads.
#
# Question: does training on the reviewed native PE attributes (acuity, location, RV/LV,
# effusions, chronic lung disease) improve the primary PE +/- head?
# Same representation, split, optimizer and fusion as diag.global.single; only the heads
# and label columns differ, so the comparison isolates multitask supervision.
# BLOCKER: every native auxiliary column and its class encoding must be verified in the
# real manifest first. Missing targets are never synthesized; unlabelled rows are masked out.
# Output: outputs/diagnosis/DX_global_native_multitask/
_base_:
  - ../../../paths.yaml
  - ../../../compute/default.yaml
  - ../../../components/backbones.yaml#ct_fm
  - ../../../components/encoders.yaml#from_c0
  - ../../../components/tasks.yaml#diagnosis
  - ../../../components/training.yaml#diagnosis
  - ../../../components/fusions.yaml#concat_mlp
experiment:
  id: DX_global_native_multitask
  name: diag.global.native_multitask
  stage: diagnosis
  family: diagnosis
data:
  mode: full
  manifest: manifests/diagnosis.csv
  file_column: image_path
  label_columns: [pe_present, acuity, central, lobar, segmental, subsegmental, saddle,
                  rv_enlargement, rv_lv_abnormal, septal_bowing, reflux, pleural_effusion,
                  pericardial_effusion, chronic_lung_disease]
  # No anatomy branches: this arm reads no masks.
  mask_columns: {}
task:
  # Heads come from components/tasks.yaml#diagnosis: pe_present plus the native attributes.
  regions: []
  silver_targets: []
  silver_loss_weight: 0.0
lineage:
  transfer_modules: [image_encoder]
  silver_method: null
  supervision_type: native_organ_multitask
supervision:
  require_masks: false
  masks: null
  require_silver_labels: false
  silver_labels: null
