# diag.anatomy.concat — anatomy-aware single-task PE diagnosis (the reference model).
#
# Question: does pooling the same full-CTPA feature map into heart / PA / lung branches,
# and fusing them with the global branch, improve PE diagnosis over global-only?
# One encoder pass over the whole volume; the branches are mask-pooled views of that same
# feature map, not organ-only inputs. Compare against diag.global.single.
#
# This run is also the frozen model used by every anatomy.remove_* counterfactual and the
# teacher for every anatomy.*_student_kd arm, so its experiment id must stay stable and its
# architecture is shared through components/task/diagnosis_anatomy_reference.yaml.
# Same contract as the pre-refactor DX18_ANATOMY_FULL arm (see legacy_id in the registry).
# Output: outputs/diagnosis/DX_anatomy_concat/  (best.ckpt is the frozen model that every
#   counterfactual scores and every distilled student imitates)
_base_:
  - ../../../paths.yaml
  - ../../../compute/default.yaml
  - ../../../components/backbone/ct_fm.yaml
  - ../../../components/encoder/from_c0.yaml
  - ../../../components/task/diagnosis.yaml
  - ../../../components/task/diagnosis_anatomy_reference.yaml
  - ../../../components/training/diagnosis.yaml
  - ../../../components/adapter/organ.yaml
  - ../../../components/fusion/concat_mlp.yaml
experiment:
  id: DX_anatomy_concat
  name: diag.anatomy.concat
  stage: diagnosis
  family: diagnosis
lineage:
  transfer_modules: [image_encoder]
  silver_method: null
  supervision_type: native_labels
