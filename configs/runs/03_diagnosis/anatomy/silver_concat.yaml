# diag.anatomy.silver.concat — anatomy branches + accepted-silver organ heads, concat fusion.
#
# Question: does supervising each organ branch with the accepted silver findings that belong
# to that organ improve PE diagnosis?
# Native supervision remains PE +/- only. The heart/PA/lung auxiliary heads are trained from
# accepted SL02 rows; abstained and no_result rows are ignored, and silver is never used as
# an evaluation label.
# This is the concat cell of the fusion comparison (concat / late-logit / Soft-MoE); the
# three arms differ only in the fusion component they inherit.
# Output: outputs/diagnosis/DX_anatomy_silver_concat/
_base_:
  - ../../../paths.yaml
  - ../../../compute/default.yaml
  - ../../../components/backbone/ct_fm.yaml
  - ../../../components/encoder/from_c0.yaml
  - ../../../components/task/diagnosis.yaml
  - ../../../components/task/diagnosis_organ_silver.yaml
  - ../../../components/training/diagnosis.yaml
  - ../../../components/adapter/organ.yaml
  - ../../../components/data/anatomy_masks.yaml
  - ../../../components/fusion/concat_mlp.yaml
experiment:
  id: DX_anatomy_silver_concat
  name: diag.anatomy.silver.concat
  stage: diagnosis
  family: diagnosis
data:
  mode: full
  manifest: manifests/diagnosis.csv
  file_column: image_path
  label_columns: [pe_present]
task:
  targets:
    _replace_: true
    pe_present: 1
  regions: [heart, pa, lung]
lineage:
  transfer_modules: [image_encoder]
  silver_method: SL02
  supervision_type: native_pe_and_accepted_silver_organ_multitask
supervision:
  require_masks: true
  masks: segmentation/SEG_pseudo_anatomy
  require_silver_labels: true
  silver_labels: silver_label/SL_hybrid_adjudicated/labels.parquet
