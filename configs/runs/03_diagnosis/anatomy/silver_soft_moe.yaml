# diag.anatomy.silver.moe — same arm as diag.anatomy.silver.concat, Soft-MoE fusion.
#
# Question: does a learned router that weights branches per patient beat fixed concatenation
# and fixed logit averaging?
# The router is masked and renormalized when a branch is unavailable. Everything except the
# fusion component matches the concat and late-logit arms.
# Same contract as the pre-refactor DX17_MULTITASK_SILVER arm.
# Output: outputs/diagnosis/DX_anatomy_silver_soft_moe/
_base_:
  - ../../../paths.yaml
  - ../../../compute/default.yaml
  - ../../../components/backbone/ct_fm.yaml
  - ../../../components/encoder/from_c0.yaml
  - ../../../components/task/diagnosis.yaml
  - ../../../components/task/diagnosis_organ_silver.yaml
  - ../../../components/training/diagnosis.yaml
  - ../../../components/adapter/organ.yaml
  - ../../../components/data/anatomy_masks.yaml
  - ../../../components/fusion/soft_moe.yaml
experiment:
  id: DX_anatomy_silver_soft_moe
  name: diag.anatomy.silver.moe
  stage: diagnosis
  family: diagnosis
data:
  mode: full
  manifest: manifests/diagnosis.csv
  file_column: image_path
  label_columns: [pe_present]
task:
  targets:
    _replace_: true
    pe_present: 1
  regions: [heart, pa, lung]
lineage:
  transfer_modules: [image_encoder]
  silver_method: SL02
  supervision_type: native_pe_and_accepted_silver_organ_multitask
supervision:
  require_masks: true
  masks: segmentation/SEG_pseudo_anatomy
  require_silver_labels: true
  silver_labels: silver_label/SL_hybrid_adjudicated/labels.parquet
