# data.silver.medgemma — MedGemma only, no rules.
#
# Question: what report-derived supervision can a single medical LLM extract?
# Text-only: the report string is the sole input; no CT volume reaches MedGemma.
# MedGemma returns null instead of a low-confidence guess, so null abstains.
# Support artifact: only rows with status=accepted may be used for training, and silver is
# never used as a gold evaluation label.
#
# Output: outputs/silver_label/medgemma/
#   silver_labels.csv            final normalized labels, one row per report/target
#   silver_label_confidence.csv  confidence, thresholds, decision and evidence
#   result.json           run summary: counts, timing, sources used, full QC aggregate
#   logs/run.log          whole terminal stream: progress, provider errors, final summary
#   resolved_config.yaml  the exact merged config, including real model paths
#   .state/<report_hash>.json  internal per-report resume cache
_base_:
  - ../../../paths.yaml
  - ../../../compute/default.yaml
  - ../../../components/silver.yaml#medgemma
experiment:
  id: medgemma
  name: data.silver.medgemma
  stage: silver
  family: silver
data:
  mode: full
seed: 42
