# data.silver.hybrid — SL02: rules + Falcon + MedGemma with agreement adjudication.
#
# Question: does two-model adjudication produce more trustworthy accepted labels?
# Disagreement abstains instead of guessing, so this arm accepts fewer but cleaner rows.
# This is the silver source the anatomy-aware multitask diagnosis arms consume.
# Both providers are loaded on every GPU rank: check VRAM before a full run.
# Output: outputs/silver_label/SL_hybrid_adjudicated/
#   labels.parquet, audit.jsonl (records both models' extractions and the adjudication),
#   result.json (QC summary including provider disagreement rates)
_base_:
  - ../../../paths.yaml
  - ../../../compute/default.yaml
  - ../../../components/silver/hybrid.yaml
experiment:
  id: SL_hybrid_adjudicated
  name: data.silver.hybrid
  stage: silver
  family: silver
data:
  mode: full
seed: 42
