# Turkey external-test mask generation using the same frozen public segmentation
# pipeline and QC contract as INSPECT. The normalized manifest is supplied by the
# study team; this config deliberately does not invent its schema or server path.
_base_:
  - ../../paths.yaml
  - ../../compute/default.yaml
experiment:
  id: SEG_turkey_pseudo_anatomy
  name: data.segmentation.turkey
  stage: segmentation
  family: segmentation
data:
  mode: full
  root: /mnt/Turkey_dataset
  dataset: Turkey
  cohort: turkey_external_test
  manifest: manifests/turkey_diagnosis.csv
  file_column: image_path
segmentation:
  backend: totalsegmentator
  executable: TotalSegmentator
  repository: third_party/repos/TotalSegmentator
  weights_directory: third_party/weights/segmentation/totalsegmentator
  fast: false
  preview_cases: null
  preview_slices_per_mask: 3
  preview_anatomies: [lung, strict_heart, pa_tree]
  preview_window_width: 700
  preview_window_level: 100
  devices: []
  workers: null
  lungmask:
    enabled: true
    executable: lungmask
    checkpoint: third_party/weights/segmentation/lungmask/R231.pth
    model_name: R231
    force_cpu: false
  lung_cross_model_qc:
    accept_dice: 0.90
    fail_below_dice: 0.70
seed: 42
