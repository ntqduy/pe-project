# data.segmentation — pseudo-anatomy masks for every CTPA study.
#
# Question: which studies have usable anatomy masks?
# TotalSegmentator is the canonical mask source; LungMask only contributes an independent
# lung Dice cross-check and never replaces a TotalSegmentator mask.
# Support artifact: consumed by anatomy-aware training, ROI construction and counterfactuals.
#
# Output: outputs/segmentation/SEG_pseudo_anatomy/
#   masks/<patient_id>/<study_id>/canonical/<anatomy>.nii.gz   19 masks per study: lung, heart,
#       strict_heart, myocardium, mediastinum, central_pa, lung_arteries, lung_veins,
#       lung_vessels, airways, pa_tree, hilar_vessels, body, body_wall, rv, lv, ra, la,
#       lung_lungmask (the independent LungMask cross-check)
#   previews/<patient_id>/<study_id>/segmentation/<anatomy>/*.png  configurable CTPA overlays
#   manifest.parquet, result.json                 mask index/QC and run summary
#   state/<patient_id>/<study_id>.json            resume state for interrupted runs
#   logs/run.log, logs/segmentation_qc.csv        terminal log and normalized per-mask QC
# The id says "pseudo": these are public-model masks, not expert-validated segmentations.
_base_:
  - ../../paths.yaml
  - ../../compute/default.yaml
experiment:
  id: SEG_pseudo_anatomy
  name: data.segmentation
  stage: segmentation
  family: segmentation
data:
  mode: full
  manifest: manifests/ctpa.csv
  file_column: image_path
segmentation:
  backend: totalsegmentator
  executable: TotalSegmentator
  repository: third_party/repos/TotalSegmentator
  weights_directory: third_party/weights/segmentation/totalsegmentator
  fast: false
  # null means every processed study. For each selected anatomy: largest-area slice plus
  # deterministic slices before/after its center. Reduce to 1 or 2 for a smaller review set.
  preview_cases: null
  preview_slices_per_mask: 3
  preview_anatomies: [lung, strict_heart, pa_tree]
  preview_window_width: 700
  preview_window_level: 100
  devices: []
  # null = one worker per GPU in devices. Set a number to run more studies at once; on CPU
  # (devices: []) that is the only way to get past one study at a time.
  workers: null
  lungmask:
    enabled: true
    executable: lungmask
    checkpoint: third_party/weights/segmentation/lungmask/R231.pth
    model_name: R231
    force_cpu: false
  lung_cross_model_qc:
    accept_dice: 0.90
    fail_below_dice: 0.70
seed: 42
