# repr.silver.hybrid — adapt the RSPECT multitask encoder with accepted SL02 labels.
#
# Question: does accepted report-derived supervision improve the externally supervised
# RSPECT representation? The input source remains configurable through WEIGHT_SOURCE.
# Output: outputs/shared_encoder/silver_encoder/sl02_hybrid/weight_rspect_multitask/
_base_:
  - ../../../paths.yaml
  - ../../../compute/default.yaml
  - ../../../components/backbone/ct_fm.yaml
  - ../../../components/encoder/from_rspect_multitask.yaml
  - ../../../components/task/silver_adaptation.yaml
experiment:
  id: SE_silver_sl02_hybrid_weight_rspect_multitask
  name: repr.silver.hybrid
  stage: silver_encoder_adaptation
  family: shared_encoder
  output_id: silver_encoder/sl02_hybrid/weight_rspect_multitask
  variant_stamp: false
data:
  mode: full
  manifest: manifests/ctpa.csv
  file_column: image_path
  label_columns: []
silver_training:
  silver_source: SL02
lineage:
  supervision_type: silver_multitask
