# repr.silver.rules_falcon — adapt the RSPECT multitask encoder with accepted SL01 labels.
#
# Question: does the rule-first silver source produce a better adapted representation than
# the LLM-only or adjudicated sources? Identical to the other two silver_adaptation arms
# except for silver_training.silver_source.
# Output: outputs/shared_encoder/silver_encoder/sl01_rules_falcon/weight_rspect_multitask/
_base_:
  - ../../../paths.yaml
  - ../../../compute/default.yaml
  - ../../../components/backbone/ct_fm.yaml
  - ../../../components/encoder/from_rspect_multitask.yaml
  - ../../../components/task/silver_adaptation.yaml
experiment:
  id: SE_silver_sl01_rules_falcon_weight_rspect_multitask
  name: repr.silver.rules_falcon
  stage: silver_encoder_adaptation
  family: shared_encoder
  output_id: silver_encoder/sl01_rules_falcon/weight_rspect_multitask
  variant_stamp: false
data:
  mode: full
  manifest: manifests/ctpa.csv
  file_column: image_path
  label_columns: []
silver_training:
  silver_source: SL01
lineage:
  supervision_type: silver_multitask
