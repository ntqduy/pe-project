# probe.diag — fixed frozen-encoder PE diagnosis probe.
#
# Question: which representation checkpoint carries the most PE information?
# Frozen encoder -> global average pool -> fixed linear head -> PE +/-.
# Nothing about the probe may be tuned per checkpoint; see components/training.yaml#probe.
# The best epoch is selected on validation; the test split is never used for selection.
#
# To probe a different representation, override the checkpoint AND the experiment id so
# runs never overwrite each other, for example:
#   python run.py run probe.diag --gpus 0 \
#     --set lineage.source_experiment=D_dapt_dino \
#     --set lineage.source_checkpoint='${PE_CLOUD_ROOT}/pe-project/outputs/pretraining/dapt/D_dapt_dino/best.ckpt' \
#     --set experiment.id=DX_probe_diagnosis_dapt_dino
# Probeable checkpoints: public FM (repr.foundation.*), each DAPT arm, C0 (repr.align),
# RSPECT transfer (repr.rspect.*) and C_silver (repr.silver.*).
# Output: outputs/diagnosis/DX_probe_diagnosis/  (one directory per probed checkpoint)
_base_:
  - ../../../paths.yaml
  - ../../../compute/default.yaml
  - ../../../components/backbones.yaml#ct_fm
  - ../../../components/encoders.yaml#from_c0
  - ../../../components/tasks.yaml#diagnosis
  - ../../../components/training.yaml#probe
experiment:
  id: DX_probe_diagnosis
  name: probe.diag
  stage: diagnosis
  family: diagnosis
data:
  mode: full
  manifest: manifests/diagnosis.csv
  file_column: image_path
  label_columns: [pe_present]
  # No anatomy branches: this arm reads no masks.
  mask_columns: {}
task:
  architecture: frozen_probe
  targets:
    _replace_: true
    pe_present: 1
  regions: []
  silver_targets: []
  silver_loss_weight: 0.0
lineage:
  transfer_modules: [image_encoder]
  supervision_type: native_labels
supervision:
  require_masks: false
  masks: null
  require_silver_labels: false
  silver_labels: null
