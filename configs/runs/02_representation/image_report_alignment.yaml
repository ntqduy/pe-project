# repr.align — symmetric InfoNCE image-report alignment. Produces C0.
#
# Question: does aligning volume features with report embeddings improve the representation
# beyond self-supervised DAPT alone?
# C0 is the shared starting point for diagnosis, prognosis, ROI students and silver adaptation.
# Reports enter as precomputed embedding columns; no text encoder runs here.
# BLOCKER: alignment.report_embedding_columns is empty and must name real manifest columns.
# Output: outputs/pretraining/alignment/AL_image_report_c0/
#   best.ckpt is C0: the aligned image encoder every downstream task starts from
_base_:
  - ../../paths.yaml
  - ../../compute/default.yaml
  - ../../components/backbones.yaml#ct_fm
  - ../../components/encoders.yaml#from_dapt
  - ../../components/objectives.yaml#image_report_alignment
  - ../../components/training.yaml#alignment
experiment:
  id: AL_image_report_c0
  name: repr.align
  stage: alignment
  family: alignment
data:
  mode: full
  manifest: manifests/paired_reports.csv
  file_column: image_path
  label_columns: []
lineage:
  supervision_type: image_report_alignment
