# repr.foundation.ct_clip — frozen public CT-CLIP image encoder under the fixed PE probe.
#
# Question: does the CT-CLIP image tower carry more PE signal than CT-FM or TotalFM?
# Only the image tower is probed here; the text tower is not used (see ct_clip_zero_shot.yaml
# for the separate, currently unavailable zero-shot contract).
# BLOCKER: configs/components/backbones.yaml#ct_clip still needs factory / output_adapter /
# feature_dim from the inspected checkpoint, and the weights must be staged locally.
# Output: outputs/diagnosis/DX_probe_ct_clip/
_base_:
  - ../../paths.yaml
  - ../../compute/default.yaml
  - ../../components/backbones.yaml#ct_clip
  - ../../components/encoders.yaml#from_pretrained
  - ../../components/tasks.yaml#diagnosis
  - ../../components/training.yaml#probe
experiment:
  id: DX_probe_ct_clip
  name: repr.foundation.ct_clip
  stage: diagnosis
  family: diagnosis
model:
  load_pretrained: true
data:
  mode: full
  manifest: manifests/diagnosis.csv
  file_column: image_path
  label_columns: [pe_present]
  # No anatomy branches: this arm reads no masks.
  mask_columns: {}
task:
  architecture: frozen_probe
  targets:
    _replace_: true
    pe_present: 1
  regions: []
  silver_targets: []
  silver_loss_weight: 0.0
lineage:
  transfer_modules: []
  supervision_type: native_labels
supervision:
  require_masks: false
  masks: null
  require_silver_labels: false
  silver_labels: null
