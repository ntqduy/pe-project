# diag.zeroshot.penet — the released PENet applied unchanged. No training of any kind.
#
# Question: how far does an off-the-shelf CTPA PE model get on this cohort, before any
# adaptation? This is the external reference a CT-FM arm has to beat.
# PENet is a trained classifier, so "zero-shot" here is literal: weights are loaded and
# run. It reads the raw release NIfTI, not volumes/*.npy -- see third_party/versions.yaml
# (components.penet.input_contract) for why the shared cache cannot be used.
# Run with tools/tasks/zeroshot_penet.py; there is no checkpoint to train or resume.
# Output: outputs/diagnosis/DX_zeroshot_penet/
_base_:
  - ../../../paths.yaml
  - ../../../compute/default.yaml
  - ../../../components/tasks.yaml#diagnosis
experiment:
  id: DX_zeroshot_penet
  name: diag.zeroshot.penet
  stage: diagnosis
  family: diagnosis
task:
  _replace_: true
  architecture: external_zero_shot
  primary_target: pe_present
  targets:
    pe_present: 1
  regions: []
  silver_targets: []
penet:
  checkpoint: third_party/weights/penet_best.pth.tar
  repo: third_party/repos/penet
  # Leave null to resolve <PE_RAW_INSPECT_ROOT>/CT/full; set it for another release layout.
  release_root: null
data:
  mode: full
  manifest: manifests/diagnosis.csv
  file_column: image_path
  label_columns: [pe_present]
  mask_columns: {}
lineage:
  backbone: penet
  initialization: released_pretrained
  source_experiment: null
  source_checkpoint: third_party/weights/penet_best.pth.tar
  transfer_modules: []
  supervision_type: none
supervision:
  require_masks: false
  require_silver_labels: false
