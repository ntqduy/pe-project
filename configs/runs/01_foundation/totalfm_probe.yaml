# repr.foundation.totalfm — frozen public TotalFM encoder under the fixed PE probe.
#
# Question: does the TotalFM representation carry more PE signal than CT-FM or CT-CLIP?
# BLOCKER: configs/components/backbones.yaml#totalfm still needs factory / output_adapter /
# feature_dim, and upstream TotalFM is organ-patch based, so it is not assumed to be a
# drop-in whole-volume encoder. Verify the pooling contract before trusting this arm.
# Output: outputs/diagnosis/DX_probe_totalfm/
_base_:
  - ../../paths.yaml
  - ../../compute/default.yaml
  - ../../components/backbones.yaml#totalfm
  - ../../components/encoders.yaml#from_pretrained
  - ../../components/tasks.yaml#diagnosis
  - ../../components/training.yaml#probe
experiment:
  id: DX_probe_totalfm
  name: repr.foundation.totalfm
  stage: diagnosis
  family: diagnosis
model:
  load_pretrained: true
data:
  mode: full
  manifest: manifests/diagnosis.csv
  file_column: image_path
  label_columns: [pe_present]
  # No anatomy branches: this arm reads no masks.
  mask_columns: {}
task:
  architecture: frozen_probe
  targets:
    _replace_: true
    pe_present: 1
  regions: []
  silver_targets: []
  silver_loss_weight: 0.0
lineage:
  transfer_modules: []
  supervision_type: native_labels
supervision:
  require_masks: false
  masks: null
  require_silver_labels: false
  silver_labels: null
