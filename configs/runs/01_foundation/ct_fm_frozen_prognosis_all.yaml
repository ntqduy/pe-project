# CT-FM frozen prognosis on all eligible index patients.
# The seven targets are the INSPECT prognosis endpoints and censored targets remain masked.
_base_:
  - ../../paths.yaml
  - ../../compute/default.yaml
  - ../../components/backbones.yaml#ct_fm
  - ../../components/encoders.yaml#from_pretrained
  - ../../components/tasks.yaml#prognosis
  - ../../components/training.yaml#prognosis
  - ../../components/fusions.yaml#concat_mlp

experiment:
  id: PR_ctfm_frozen_all
  name: foundation.ct_fm_frozen.prognosis_all_patient
  stage: prognosis
  family: prognosis
  baseline_backbone: ct_fm
  baseline_init: pretrained

data:
  mode: full
  profile: full_inspect
  cohort: all_comers
  manifest: ct_fm_frozen/manifests/prognosis_all_patient.csv
  file_column: image_path
  label_columns:
    - 1_month_mortality
    - 6_month_mortality
    - 12_month_mortality
    - 1_month_readmission
    - 6_month_readmission
    - 12_month_readmission
    - 12_month_PH
  mask_columns: {}

task:
  _replace_: true
  primary_target: 1_month_mortality
  targets:
    1_month_mortality: 1
    6_month_mortality: 1
    12_month_mortality: 1
    1_month_readmission: 1
    6_month_readmission: 1
    12_month_readmission: 1
    12_month_PH: 1
  modalities: [image]
  regions: []
  architecture: concat_mlp

peft:
  method: frozen

lineage:
  transfer_modules: []
  supervision_type: native_labels

supervision:
  require_masks: false
  masks: null
  require_ehr: false
  require_spesi: false

# Default full experiment budget. The task scripts can override both values for a smoke run.
training:
  epochs: 50
  early_stopping_patience: 10
  record_epoch_auc: true
