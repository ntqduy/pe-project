# CT-FM frozen diagnosis: CT-FM backbone -> trainable MLP classifier.
#
# CT-FM features are precomputed once per study by tools/data/build_ctfm_cache.py at the
# upstream contract (SPL, 3x1x1 mm, 24x128x128 patches) and read from manifests/ct_fm/*.csv,
# which are the already-filtered official train/validation/test manifests with image_path
# pointing at the features; this config never creates a split. Only the classifier and the
# small feature adapter are trainable.
_base_:
  - ../../paths.yaml
  - ../../compute/default.yaml
  - ../../components/backbones.yaml#ct_fm_features
  - ../../components/encoders.yaml#from_pretrained
  - ../../components/tasks.yaml#diagnosis
  - ../../components/training.yaml#diagnosis
  - ../../components/fusions.yaml#concat_mlp

experiment:
  id: DX_ctfm_frozen
  name: foundation.ct_fm_frozen.diagnosis
  stage: diagnosis
  family: diagnosis
  baseline_backbone: ct_fm_features
  baseline_init: pretrained

data:
  mode: full
  profile: full_inspect
  manifest: manifests/ct_fm/diagnosis.csv
  # The MLP only sees the body-weighted mean of the grid, so it reads the pooled copy
  # (float32 [513, 1, 1, 1], ~2 KB, written by build_ctfm_cache.py) and keeps all of them in
  # RAM, instead of re-reading every 5.9 MB grid each epoch. Same global embedding (checked:
  # relative difference ~1e-7). Previews still use the grid (image_path). image_path here
  # (FEATURE_INPUT=grid in the wrapper) reproduces the grid-reading runs.
  file_column: pooled_path
  preload_inputs: true
  label_columns: [pe_present]
  mask_columns: {}

task:
  _replace_: true
  primary_target: pe_present
  targets:
    pe_present: 1
  regions: []
  architecture: concat_mlp
  silver_targets: []
  silver_loss_weight: 0.0

# This is the frozen-encoder + trainable classification head contract.
peft:
  method: frozen

# Frozen CT-FM pooled features share a large per-channel offset across patients (~99% of
# each global vector on smoke_30), which hides the between-patient differences from the
# small trainable head. Standardize every pooled branch (global, and heart/pa/lung in the
# anatomy arms) per channel with a centre/scale fit on the train split only and stored in
# the checkpoint. Every CT-FM frozen arm inherits this, so the arms stay comparable.
organ_adapter:
  standardize_inputs: true

lineage:
  transfer_modules: []
  supervision_type: native_labels

supervision:
  require_masks: false
  masks: null
  require_silver_labels: false
  silver_labels: null

# Default full experiment budget. The task scripts can override epochs and patience for a
# smoke run. batch_size 4 with no accumulation: one optimizer step per 4 studies in every
# CT-FM frozen arm (runs up to epoch_50 used batch 1; diagnosis also accumulated 4 steps).
training:
  epochs: 100
  early_stopping_patience: 15
  batch_size: 4
  gradient_accumulation: 1
  record_epoch_auc: true
