# prog.global.moe — global image + EHR + PESI, Soft-MoE fusion.
#
# Question: does a learned per-patient router over the modalities beat fixed concatenation
# and fixed logit averaging?
# Identical to prog.image_ehr_pesi (= prog.global.concat) except for the fusion component.
# Output: outputs/prognosis/PR_global_soft_moe/
_base_:
  - ../../../paths.yaml
  - ../../../compute/default.yaml
  - ../../../components/backbone/ct_fm.yaml
  - ../../../components/task/prognosis.yaml
  - ../../../components/task/prognosis_primary_cohort.yaml
  - ../../../components/training/prognosis.yaml
  - ../../../components/fusion/soft_moe.yaml
experiment:
  id: PR_global_soft_moe
  name: prog.global.moe
  stage: prognosis
  family: prognosis
task:
  modalities: [image, ehr, pesi]
  regions: []
lineage:
  backbone: CT-FM
  initialization: C0
  source_experiment: AL_image_report_c0
  source_checkpoint: ${PE_CLOUD_ROOT}/pe-project/outputs/pretraining/alignment/AL_image_report_c0/best.ckpt
  transfer_modules: [image_encoder]
  supervision_type: native_labels
supervision:
  require_masks: false
  masks: null
  require_ehr: true
  ehr: ${PE_CLOUD_ROOT}/data/derived/ehr
  require_pesi: true
  pesi: ${PE_CLOUD_ROOT}/data/derived/pesi
