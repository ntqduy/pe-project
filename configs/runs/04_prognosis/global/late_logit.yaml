# prog.global.late — global image + EHR + PESI, late-logit fusion.
#
# Question: is it better to average modality *decisions* than to concatenate modality
# *features*? Late fusion also degrades gracefully: a patient missing the clinical record
# drops that branch from the average instead of feeding it zeros.
# Identical to prog.image_ehr_pesi (= prog.global.concat) except for the fusion component.
# Output: outputs/prognosis/PR_global_late_logit/
_base_:
  - ../../../paths.yaml
  - ../../../compute/default.yaml
  - ../../../components/backbones.yaml#ct_fm
  - ../../../components/encoders.yaml#from_c0
  - ../../../components/tasks.yaml#prognosis
  - ../../../components/tasks.yaml#prognosis_primary_cohort
  - ../../../components/training.yaml#prognosis
  - ../../../components/fusions.yaml#late_logit
experiment:
  id: PR_global_late_logit
  name: prog.global.late
  stage: prognosis
  family: prognosis
task:
  modalities: [image, ehr, pesi]
  regions: []
lineage:
  transfer_modules: [image_encoder]
  supervision_type: native_labels
supervision:
  require_masks: false
  masks: null
  require_ehr: true
  ehr: clinical/ehr_features.csv
  require_pesi: true
  pesi: clinical/pesi_features.csv
