# prog.image_ehr — global image plus the raw clinical record.
#
# Question: does imaging add information beyond the full clinical record?
# BLOCKER: data.ehr_columns is empty; its length must match task.ehr_input_dim (32).
# Output: outputs/prognosis/PR_image_ehr/
_base_:
  - ../../../paths.yaml
  - ../../../compute/default.yaml
  - ../../../components/backbones.yaml#ct_fm
  - ../../../components/encoders.yaml#from_c0
  - ../../../components/tasks.yaml#prognosis
  - ../../../components/tasks.yaml#prognosis_primary_cohort
  - ../../../components/training.yaml#prognosis
  - ../../../components/fusions.yaml#concat_mlp
experiment:
  id: PR_image_ehr
  name: prog.image_ehr
  stage: prognosis
  family: prognosis
task:
  modalities: [image, ehr]
  regions: []
lineage:
  transfer_modules: [image_encoder]
  supervision_type: native_labels
supervision:
  require_masks: false
  masks: null
  require_ehr: true
  ehr: clinical/ehr_features.csv
  require_pesi: false
