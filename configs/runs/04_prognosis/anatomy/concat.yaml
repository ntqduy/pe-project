# prog.anatomy.concat — anatomy-aware image + EHR + PESI, concatenation fusion.
#
# Question: does splitting the image evidence into heart / PA / lung branches predict
# mortality better than one global image vector, with the clinical inputs held fixed?
# Compare against prog.image_ehr_pesi (same modalities, global image, same fusion).
# Same contract as the pre-refactor PR22_ANATOMY_CLINICAL_PESI arm.
# BLOCKER: data.ehr_columns is empty; its length must match task.ehr_input_dim (32).
# Output: outputs/prognosis/PR_anatomy_concat/
_base_:
  - ../../../paths.yaml
  - ../../../compute/default.yaml
  - ../../../components/backbone/ct_fm.yaml
  - ../../../components/encoder/from_c0.yaml
  - ../../../components/task/prognosis.yaml
  - ../../../components/task/prognosis_primary_cohort.yaml
  - ../../../components/training/prognosis.yaml
  - ../../../components/adapter/organ.yaml
  - ../../../components/data/anatomy_masks.yaml
  - ../../../components/fusion/concat_mlp.yaml
experiment:
  id: PR_anatomy_concat
  name: prog.anatomy.concat
  stage: prognosis
  family: prognosis
task:
  modalities: [image, ehr, pesi]
  regions: [heart, pa, lung]
lineage:
  transfer_modules: [image_encoder]
  supervision_type: native_labels
supervision:
  require_masks: true
  masks: segmentation/SEG_pseudo_anatomy
  require_ehr: true
  ehr: clinical/ehr_features.csv
  require_pesi: true
  pesi: clinical/pesi_features.csv
