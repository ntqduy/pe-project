# prog.anatomy.moe — anatomy-aware image + EHR + PESI, Soft-MoE fusion.
#
# Question: does a learned router over anatomy branches and clinical branches beat fixed
# concatenation and fixed logit averaging?
# Identical to prog.anatomy.concat except for the fusion component.
# Output: outputs/prognosis/PR_anatomy_soft_moe/
_base_:
  - ../../../paths.yaml
  - ../../../compute/default.yaml
  - ../../../components/backbones.yaml#ct_fm
  - ../../../components/encoders.yaml#from_c0
  - ../../../components/tasks.yaml#prognosis
  - ../../../components/tasks.yaml#prognosis_primary_cohort
  - ../../../components/training.yaml#prognosis
  - ../../../components/anatomy.yaml#organ_adapter
  - ../../../components/anatomy.yaml#anatomy_masks
  - ../../../components/fusions.yaml#soft_moe
experiment:
  id: PR_anatomy_soft_moe
  name: prog.anatomy.moe
  stage: prognosis
  family: prognosis
task:
  modalities: [image, ehr, pesi]
  regions: [heart, pa, lung]
lineage:
  transfer_modules: [image_encoder]
  supervision_type: native_labels
supervision:
  require_masks: true
  masks: segmentation/SEG_pseudo_anatomy
  require_ehr: true
  ehr: clinical/ehr_features.csv
  require_pesi: true
  pesi: clinical/pesi_features.csv
