        experiment: data.dataset.full_inspect
        path_key: data.manifest
      - what: Anatomy masks
        experiment: data.segmentation
        path_key: supervision.masks
      - what: ROI manifest supplying the heart/PA/lung branch masks
        experiment: data.roi
        path_key: data.roi_manifest
