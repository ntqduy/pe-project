    group: FOUNDATION
    description: "CT-FM frozen + trainable organ adapters + concatenation fusion for image-only prognosis"
    question: Do organ-pooled frozen CT-FM features beat the global frozen vector for prognosis?
    representation: frozen public CT-FM (cached features)
    task: prognosis
    modalities: [image]
