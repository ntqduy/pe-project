    requires:
      - what: Built dataset profile with the official split
        experiment: data.dataset.full_inspect
      - what: CT-FM feature cache and manifests/ct_fm/prognosis_all_patient.csv (scripts/tool/run_ctfm_frozen.sh ACTION=prepare)
        path_key: data.manifest
      - what: Staged CT-FM feature-extractor weights (third_party/versions.yaml)
        path_key: model.checkpoint
    produces: [PR_ctfm_frozen_all checkpoint, validation/test metrics and predictions]
    status: ready

  foundation.ct_fm_frozen.prognosis_pe_positive:
