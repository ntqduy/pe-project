    representation: none
    task: silver
    modalities: [reports]
    anatomy: false
    supervision: none
    fusion: none
    requires:
      - what: Report table with report_id and report_text
        experiment: data.dataset.full_inspect
        path_key: silver.reports
      - what: Local Falcon and MedGemma (both loaded per GPU rank) weights
        blocker: silver_model_weights
    produces: [accepted/abstained/no_result labels, audit trail, QC review queue]
