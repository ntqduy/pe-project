# PE project — experiment registry
#
# This is the human-facing index of the active pipeline. Every entry answers: what is this
# experiment, what question does it answer, what must exist before it can run, and what does
# it leave behind. `run.py` reads only this file to resolve a semantic name to a config.
#
# Semantic names are the interface. Each config's experiment.id is the output key: it names
# the run directory under outputs/ and is stamped into every checkpoint's lineage, so it is
# self-describing too (SEG_pseudo_anatomy, DX_anatomy_concat, CF_remove_pa, ...).
# legacy_id records the pre-refactor id an arm replaces (SEG01, DX18_ANATOMY_FULL, ...) so
# older notes and result folders stay traceable. It is documentation, nothing reads it.
#
# status:
#   ready       config is complete; missing artifacts are reported by `run.py plan`
#   blocked     an unresolved data or checkpoint contract must be filled first (see blockers)
#   deferred    intentionally outside the active pipeline
#   unavailable cannot run by design; the contract is documented but not implemented
#
# requires entries may carry:
#   experiment  the registry name that produces this artifact (used by `run.py plan`)
#   path_key    dotted key in the resolved config whose value is the artifact path
#   blocker     an unresolved contract rather than a missing file

project_blockers:
  - id: backbone_contract
    what: >-
      configs/components/backbones.yaml still has empty factory /
      output_adapter and feature_dim 0. Every image experiment fails preflight until the
      inspected checkpoint contract is filled in and the weights are staged locally.
  - id: inspect_manifests
    what: >-
      manifests/ctpa.csv, manifests/diagnosis.csv, manifests/prognosis.csv and
      manifests/paired_reports.csv must exist under the derived data root for the
      selected dataset profile. They are produced by data.dataset.<profile>, which
      preserves the official INSPECT split; no split is ever created implicitly.
  - id: pesi_clinical_approval
    what: >-
      configs/clinical/pesi_spesi_mapping.yaml still has a pending clinical_approval
      status, so stage 0 writes a blocked clinical/pesi_status.json and no PESI/sPESI
      score exists.
      Every prognosis arm with `pesi` in task.modalities stays blocked until a clinical
      steward approves all eleven components and supplies pesi.components_table. No score
      is ever pattern-matched out of raw events.

experiments:

  # -------------------------------------------------------------- DATASET
  # Three active dataset profiles, one implementation. They share every eligibility, QC,
  # adjudication, manifest and preprocessing rule (source/dataset/profiles/_common.yaml);
  # only the sampling block differs. Every later stage selects one of them with
  # `--set data.profile=<name>`, and the run id records the choice.
  data.dataset.smoke_30:
    config: configs/runs/00_data/dataset/smoke_30.yaml
    group: DATASET
    description: Build a deterministic 30-patient all-split technical smoke cohort
    question: Does the exact dataset-build code path and QC report work before rehearsal?
    representation: none
    task: dataset
    modalities: [image, reports, labels]
    anatomy: false
    supervision: none
    fusion: none
    requires:
      - what: The read-only Stanford INSPECT release (checked by preflight, not by plan)
    produces:
      - the same manifest, audit and CT-cache layout as every dataset profile
      - data_quality.md/json for a small all-split cohort
    status: ready

  data.dataset.full_inspect:
    config: configs/runs/00_data/dataset/full_inspect.yaml
    group: DATASET
    description: Build the whole eligible INSPECT cohort - filtering, QC, split audit, manifests
    question: Which patients and studies does this project actually train and evaluate on?
    representation: none
    task: dataset
    modalities: [image, reports, labels]
    anatomy: false
    supervision: none
    fusion: none
    requires:
      - what: The read-only Stanford INSPECT release (checked by preflight, not by plan)
    produces:
      - ctpa/diagnosis/prognosis/paired_reports/reports manifests
      - data_quality.md/json (compact cohort and QC summary)
      - audit/ (detailed exclusions, integrity, split and cache-QC findings)
      - dataset.json (provenance + preprocessing hash)
      - preprocessed volume cache
    status: ready

  data.dataset.test_500_sample:
    config: configs/runs/00_data/dataset/test_500_sample.yaml
    group: DATASET
    description: The same cohort reduced to 500 patients, sampled patient-level inside the official split
    question: Does the whole pipeline run end to end before it is run at full cost?
    representation: none
    task: dataset
    modalities: [image, reports, labels]
    anatomy: false
    supervision: none
    fusion: none
    requires:
      - what: The read-only Stanford INSPECT release (checked by preflight, not by plan)
    produces:
      - the same manifest set as full_inspect, for 500 patients
      - subset_metadata inside dataset.json (seed, per-split targets, strata summary)
    status: ready

  # ----------------------------------------------------------------- DATA
  data.segmentation:
    config: configs/runs/00_data/segmentation.yaml
    group: DATA
    legacy_id: SEG01
    description: TotalSegmentator pseudo-anatomy masks with LungMask lung Dice QC
    question: Which studies have usable anatomy masks?
    representation: none
    task: segmentation
    modalities: [image]
    anatomy: produces
    supervision: none
    fusion: none
    requires:
      - what: CTPA manifest with a patient-level split
        experiment: data.dataset.full_inspect
        path_key: data.manifest
      - what: TotalSegmentator CLI, repository and offline task weights
        blocker: segmentation_backend
    produces: [anatomy masks, mask manifest, QC report, preview images]
    status: ready

  data.roi:
    config: configs/runs/00_data/roi.yaml
    group: DATA
    legacy_id: ROI01
    description: ROI1-ROI8 semantic masks and rigid volume-matched random controls from a finished segmentation run
    question: Which studies have usable ROI artifacts and matched random controls?
    representation: none
    task: roi
    modalities: [image]
    anatomy: produces
    supervision: none
    fusion: none
    requires:
      - what: Completed segmentation run
        experiment: data.segmentation
        path_key: roi.segmentation_run
    produces: [ROI1-ROI8 masks, ROI manifest, QC report]
    status: ready

  data.segmentation.rspect:
    config: configs/runs/00_data/segmentation_rspect.yaml
    group: DATA
    description: Apply the identical pseudo-anatomy segmentation contract to normalized RSPECT
    question: Are external RSPECT volumes anatomically usable before model evaluation?
    representation: none
    task: segmentation
    modalities: [image]
    anatomy: produces
    supervision: none
    fusion: none
    requires:
      - what: Extracted RSPECT volumes and normalized patient-level manifest
        path_key: data.manifest
        blocker: rspect_manifest
    produces: [external anatomy masks, QC CSV, review previews]
    status: blocked
    blockers: [The normalized RSPECT manifest and extracted volumes are not present.]

  data.roi.rspect:
    config: configs/runs/00_data/roi_rspect.yaml
    group: DATA
    description: Derive semantic ROIs and rigid matched controls for normalized RSPECT
    question: Are the same anatomy-aware inputs available on the external cohort?
    representation: none
    task: roi
    modalities: [image]
    anatomy: produces
    supervision: none
    fusion: none
    requires:
      - what: Completed external segmentation run
        experiment: data.segmentation.rspect
        path_key: roi.segmentation_run
    produces: [external ROI masks, ROI QC CSV, review previews]
    status: blocked
    blockers: [Depends on normalized RSPECT data and external segmentation.]

  data.segmentation.turkey:
    config: configs/runs/00_data/segmentation_turkey.yaml
