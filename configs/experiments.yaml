# PE project — experiment registry
#
# This is the human-facing index of the active pipeline. Every entry answers: what is this
# experiment, what question does it answer, what must exist before it can run, and what does
# it leave behind. `run.py` reads only this file to resolve a semantic name to a config.
#
# Semantic names are the interface. Each config's experiment.id is the output key: it names
# the run directory under outputs/ and is stamped into every checkpoint's lineage, so it is
# self-describing too (SEG_pseudo_anatomy, DX_anatomy_concat, CF_remove_pa, ...).
# legacy_id records the pre-refactor id an arm replaces (SEG01, DX18_ANATOMY_FULL, ...) so
# older notes and result folders stay traceable. It is documentation, nothing reads it.
#
# status:
#   ready       config is complete; missing artifacts are reported by `run.py plan`
#   blocked     an unresolved data or checkpoint contract must be filled first (see blockers)
#   deferred    intentionally outside the active pipeline
#   unavailable cannot run by design; the contract is documented but not implemented
#
# requires entries may carry:
#   experiment  the registry name that produces this artifact (used by `run.py plan`)
#   path_key    dotted key in the resolved config whose value is the artifact path
#   blocker     an unresolved contract rather than a missing file

project_blockers: []

experiments:

  # -------------------------------------------------------------- DATASET
  # Three active dataset profiles, one implementation. They share every eligibility, QC,
  # adjudication, manifest and preprocessing rule (source/data/profiles/_common.yaml);
  # only the sampling block differs. Every later stage selects one of them with
  # `--set data.profile=<name>`, and the run id records the choice.
  data.dataset.smoke_30:
    config: configs/runs/00_data/dataset/smoke_30.yaml
    group: DATASET
    description: Build a deterministic 30-patient all-split technical smoke cohort
    question: Does the exact dataset-build code path and QC report work before rehearsal?
    representation: none
    task: dataset
    modalities: [image, reports, labels]
    anatomy: false
    supervision: none
    fusion: none
    requires:
      - what: The read-only Stanford INSPECT release (checked by preflight, not by plan)
    produces:
      - the same manifest, audit and CT-cache layout as every dataset profile
      - data_quality.md with task labels, missingness and QC
    status: ready

  data.dataset.full_inspect:
    config: configs/runs/00_data/dataset/full_inspect.yaml
    group: DATASET
    description: Build the whole eligible INSPECT cohort - filtering, QC, split audit, manifests
    question: Which patients and studies does this project actually train and evaluate on?
    representation: none
    task: dataset
    modalities: [image, reports, labels]
    anatomy: false
    supervision: none
    fusion: none
    requires:
      - what: The read-only Stanford INSPECT release (checked by preflight, not by plan)
    produces:
      - ctpa/diagnosis/prognosis/paired_reports/reports manifests
      - data_quality.md (cohort, task labels, missingness and QC)
      - audit/exclusions.csv (patient-linked exclusions)
      - dataset.json (provenance + preprocessing hash)
      - preprocessed volume cache
    status: ready

  data.dataset.test_500_sample:
    config: configs/runs/00_data/dataset/test_500_sample.yaml
    group: DATASET
    description: The same cohort reduced to 500 patients, sampled patient-level inside the official split
    question: Does the whole pipeline run end to end before it is run at full cost?
    representation: none
    task: dataset
    modalities: [image, reports, labels]
    anatomy: false
    supervision: none
    fusion: none
    requires:
      - what: The read-only Stanford INSPECT release (checked by preflight, not by plan)
    produces:
      - the same manifest set as full_inspect, for 500 patients
      - subset_metadata inside dataset.json (seed, per-split targets, strata summary)
    status: ready

  # ----------------------------------------------------------------- DATA
  data.segmentation:
    config: configs/runs/00_data/segmentation/inspect.yaml
    group: DATA
    legacy_id: SEG01
    description: TotalSegmentator pseudo-anatomy masks with LungMask lung Dice QC
    question: Which studies have usable anatomy masks?
    representation: none
    task: segmentation
    modalities: [image]
    anatomy: produces
    supervision: none
    fusion: none
    requires:
      - what: CTPA manifest with a patient-level split
        experiment: data.dataset.full_inspect
        path_key: data.manifest
      - what: TotalSegmentator offline task weights (third_party/versions.yaml, totalsegmentator)
        path_key: segmentation.weights_directory
      - what: LungMask R231 checkpoint (third_party/versions.yaml, lungmask)
        path_key: segmentation.lungmask.checkpoint
    produces: [anatomy masks, mask manifest, QC report, preview images]
    status: ready

  data.roi:
    config: configs/runs/00_data/roi/inspect.yaml
    group: DATA
    legacy_id: ROI01
    description: ROI1-ROI8 semantic masks and rigid volume-matched random controls from a finished segmentation run
    question: Which studies have usable ROI artifacts and matched random controls?
    representation: none
    task: roi
    modalities: [image]
    anatomy: produces
    supervision: none
    fusion: none
    requires:
      - what: Completed segmentation run
        experiment: data.segmentation
        path_key: roi.segmentation_run
    produces: [ROI1-ROI8 masks, ROI manifest, QC report]
    status: ready

  data.segmentation.turkey:
    config: configs/runs/00_data/segmentation/turkey.yaml
    group: DATA
    description: Apply the frozen INSPECT segmentation contract to the Turkey external cohort
    question: Are Turkey volumes anatomically usable under the same mask protocol?
    representation: none
    task: segmentation
    modalities: [image]
    anatomy: produces
    supervision: none
    fusion: none
    requires:
      - what: Turkey volumes and normalized test-only manifest from the study team
        path_key: data.manifest
        blocker: turkey_manifest
    produces: [Turkey anatomy masks, QC CSV, review previews]
    status: blocked
    blockers: ["The Turkey server path, normalized manifest and exact case count are not available."]

  data.roi.turkey:
    config: configs/runs/00_data/roi/turkey.yaml
    group: DATA
    description: Derive ROI1-ROI8 and matched controls for the Turkey cohort
    question: Are the same anatomy-aware inputs available for primary external testing?
    representation: none
    task: roi
    modalities: [image]
    anatomy: produces
    supervision: none
    fusion: none
    requires:
      - what: Completed Turkey segmentation run
        experiment: data.segmentation.turkey
        path_key: roi.segmentation_run
    produces: [Turkey ROI masks, ROI QC CSV, review previews]
    status: blocked
    blockers: [Depends on delivery and segmentation of the Turkey cohort.]


  # One silver arm: MedGemma extraction from the report text, accepted or abstained per
  # target; with rule_rescue (configs/components/silver.yaml) the explicit regex extractor
  # vetoes explicit contradictions and fills in when MedGemma abstains.
  # Logic: source/silver/generator.py.

  data.silver.medgemma:
    config: configs/runs/00_data/silver/medgemma.yaml
    group: DATA
    description: MedGemma extraction with optional explicit-regex rescue (rule_rescue), report text only
    question: What supervision can a single medical LLM extract from the reports?
    representation: none
    task: silver
    modalities: [reports]
    anatomy: false
    supervision: none
    fusion: none
    requires:
      - what: Report table with report_id and report_text
        experiment: data.dataset.full_inspect
        path_key: silver.reports
      - what: Local MedGemma weights (google/medgemma-1.5-4b-it, revision in third_party/versions.yaml)
        path_key: silver.medgemma.model_path
    produces: [accepted/abstained/no_result labels, audit trail, QC review queue]
    status: ready

  # ----------------------------------------------------------- FOUNDATION
  # Frozen public CT-FM: features are computed once per study by tools/data/build_ctfm_cache.py
  # (scripts/tool/run_ctfm_frozen.sh ACTION=prepare); only the adapters, fusion and heads train.
  # These replace the earlier fixed-probe arm repr.foundation.ct_fm (ct_fm_probe.yaml).
  foundation.ct_fm_frozen.diagnosis:
    config: configs/runs/01_foundation/ct_fm_frozen/diagnosis.yaml
    group: FOUNDATION
    description: "CT-FM frozen diagnosis: CT-FM backbone -> trainable MLP classifier"
    question: How much PE signal does the frozen public CT-FM representation already carry?
    representation: frozen public CT-FM (cached features)
    task: diagnosis
    modalities: [image]
    anatomy: false
    supervision: native PE label
    fusion: concat_mlp
    requires:
      - what: Built dataset profile with the official split
        experiment: data.dataset.full_inspect
      - what: CT-FM feature cache and manifests/ct_fm/diagnosis.csv (scripts/tool/run_ctfm_frozen.sh ACTION=prepare)
        path_key: data.manifest
      - what: Staged CT-FM feature-extractor weights (third_party/versions.yaml)
        path_key: model.checkpoint
    produces: [DX_ctfm_frozen checkpoint, validation/test metrics and predictions]
    status: ready

  foundation.ct_fm_frozen.prognosis_all_patient:
