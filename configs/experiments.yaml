    requires:
      - what: Built dataset profile with the official split
        experiment: data.dataset.full_inspect
      - what: CT-FM feature cache and manifests/ct_fm/prognosis_all_patient.csv (scripts/tool/run_ctfm_frozen.sh ACTION=prepare)
        path_key: data.manifest
      - what: Staged CT-FM feature-extractor weights (third_party/versions.yaml)
        path_key: model.checkpoint
      - what: Anatomy masks
        experiment: data.segmentation
        path_key: supervision.masks
      - what: ROI manifest supplying the heart/PA/lung branch masks
        experiment: data.roi
        path_key: data.roi_manifest
    produces: [PR_ctfm_anatomy_moe checkpoint, validation/test metrics and predictions]
    status: ready

  # ----------------------------------------------------------- DIAGNOSIS
  diag.zeroshot.penet:
    config: configs/runs/01_foundation/zero_shot/penet.yaml
    group: FOUNDATION
    description: Released PENet applied unchanged, no training
    question: How far does an off-the-shelf CTPA PE model get before any adaptation?
    representation: none (external pretrained)
    task: diagnosis
    modalities: [image]
    anatomy: false
    supervision: none
    fusion: none
    runner: tools/tasks/zeroshot_penet.py
    requires:
      - what: Diagnosis manifest with pe_present
        experiment: data.dataset.full_inspect
        path_key: data.manifest
      - what: Raw release NIfTI under <PE_RAW_INSPECT_ROOT>/CT/full/CTPA
        path_key: penet.release_root
    produces: [the external zero-shot reference every in-house imaging arm must beat]
    status: ready

  diag.zeroshot.radar:
    config: configs/runs/01_foundation/zero_shot/radar.yaml
    group: FOUNDATION
    description: Released RADAR (abdominal-CT generalist) probed for PE, no training
    question: Does a CT vision-language generalist recognise PE on CTPA without adaptation?
    representation: none (external pretrained, pulmonary-artery organ token vs text pair)
    task: diagnosis
    modalities: [image]
    anatomy: false
    supervision: none
    fusion: none
    runner: tools/tasks/zeroshot_radar.py
    requires:
      - what: Diagnosis manifest with pe_present
        experiment: data.dataset.full_inspect
        path_key: data.manifest
      - what: Raw release NIfTI under <PE_RAW_INSPECT_ROOT>/CT/full/CTPA
        path_key: radar.release_root
      - what: RADAR checkpoint (repository cloned; its requirements.txt built as a separate conda env)
        path_key: radar.checkpoint
    produces: [an out-of-scope zero-shot reference; RADAR ships no PE finding, so radar.prompts defines the arm]
    status: ready

  diag.global.penet_style:
    config: configs/runs/02_diagnosis/global/penet_style.yaml
    group: DIAGNOSIS
    description: Randomly initialized end-to-end PENet-style 3D CNN baseline
    question: Does FM initialization and staged adaptation beat a comparable non-FM 3D model?
    representation: random end-to-end 3D CNN
    task: diagnosis
    modalities: [image]
    anatomy: false
    supervision: native PE label
    fusion: concat_mlp
    requires:
      - what: Diagnosis manifest with patient-level split
        experiment: data.dataset.full_inspect
        path_key: data.manifest
    produces: [non-foundation diagnosis baseline metrics]
    status: ready

  diag.global.single:
    config: configs/runs/02_diagnosis/global/global_single.yaml
    group: DIAGNOSIS
    description: Global full-CTPA image features with a single PE +/- head
    question: How well does whole-volume image evidence alone predict native PE labels?
    representation: public backbone
    task: diagnosis
    modalities: [image]
    anatomy: false
