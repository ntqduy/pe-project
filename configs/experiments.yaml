        path_key: data.manifest
        blocker: turkey_manifest
    produces: [Turkey anatomy masks, QC CSV, review previews]
    status: blocked
    blockers: [The Turkey server path, normalized manifest and exact case count are not available.]

  data.roi.turkey:
    config: configs/runs/00_data/roi_turkey.yaml
    group: DATA
    description: Derive ROI1-ROI8 and matched controls for the Turkey cohort
    question: Are the same anatomy-aware inputs available for primary external testing?
    representation: none
    task: roi
    modalities: [image]
    anatomy: produces
    supervision: none
    fusion: none
    requires:
      - what: Completed Turkey segmentation run
        experiment: data.segmentation.turkey
        path_key: roi.segmentation_run
    produces: [Turkey ROI masks, ROI QC CSV, review previews]
    status: blocked
    blockers: [Depends on delivery and segmentation of the Turkey cohort.]


  # Seven silver arms, one implementation. The name IS the cascade, in order: the cheapest
  # deterministic source that can settle a target wins, and two LLMs are adjudicated so that
  # disagreement abstains rather than guessing. Logic: source/silver/generator.py.
  # data.silver.rule needs no weights and is the only arm that is not blocked.

  data.silver.rule:
    config: configs/runs/00_data/silver/rule.yaml
    group: DATA
    description: Deterministic regex extraction only, no model
    question: How far does a rule-only extractor get before any LLM is involved?
    representation: none
    task: silver
    modalities: [reports]
    anatomy: false
    supervision: none
    fusion: none
    requires:
      - what: Report table with report_id and report_text
        experiment: data.dataset.full_inspect
        path_key: silver.reports
    produces: [accepted/abstained labels from regex only, audit trail, QC review queue]
    status: ready

  data.silver.falcon:
    config: configs/runs/00_data/silver/falcon.yaml
    group: DATA
    description: Falcon extraction only, no rule prior
    question: What does a general-purpose LLM extract from the reports without rules?
    representation: none
    task: silver
    modalities: [reports]
    anatomy: false
    supervision: none
    fusion: none
    requires:
      - what: Report table with report_id and report_text
        experiment: data.dataset.full_inspect
        path_key: silver.reports
      - what: Local Falcon weights
        blocker: silver_model_weights
    produces: [accepted/abstained/no_result labels, audit trail, QC review queue]
    status: blocked
    blockers:
      - Local Falcon model directory is not staged and its exact model id/revision is unrecorded.

  data.silver.medgemma:
    config: configs/runs/00_data/silver/medgemma.yaml
    group: DATA
    description: MedGemma extraction only, no rule prior (report text only)
    question: What supervision can a single medical LLM extract from the reports?
    representation: none
    task: silver
    modalities: [reports]
    anatomy: false
    supervision: none
    fusion: none
    requires:
      - what: Report table with report_id and report_text
        experiment: data.dataset.full_inspect
        path_key: silver.reports
      - what: Local MedGemma weights
        blocker: silver_model_weights
    produces: [accepted/abstained/no_result labels, audit trail, QC review queue]
    status: blocked
    blockers:
      - Local MedGemma model directory is not staged and its exact model id/revision is unrecorded.

  data.silver.rule_falcon:
    config: configs/runs/00_data/silver/rule_falcon.yaml
    group: DATA
    description: Deterministic rules, then Falcon for whatever the rules leave unresolved
    question: Does a rule-first cascade extract report supervision more reliably than an LLM alone?
    representation: none
    task: silver
    modalities: [reports]
    anatomy: false
    supervision: none
    fusion: none
    requires:
      - what: Report table with report_id and report_text
        experiment: data.dataset.full_inspect
        path_key: silver.reports
      - what: Local Falcon weights
        blocker: silver_model_weights
    produces: [accepted/abstained/no_result labels, audit trail, QC review queue]
    status: blocked
    blockers:
      - Local Falcon model directory is not staged and its exact model id/revision is unrecorded.

  data.silver.rule_medgemma:
    config: configs/runs/00_data/silver/rule_medgemma.yaml
    group: DATA
    description: Deterministic rules, then MedGemma for whatever the rules leave unresolved
    question: Does the medical LLM add more on top of rules than the general-purpose one?
    representation: none
    task: silver
    modalities: [reports]
    anatomy: false
    supervision: none
    fusion: none
    requires:
      - what: Report table with report_id and report_text
        experiment: data.dataset.full_inspect
        path_key: silver.reports
      - what: Local MedGemma weights
        blocker: silver_model_weights
    produces: [accepted/abstained/no_result labels, audit trail, QC review queue]
    status: blocked
    blockers:
      - Local MedGemma model directory is not staged and its exact model id/revision is unrecorded.

  data.silver.falcon_medgemma:
    config: configs/runs/00_data/silver/falcon_medgemma.yaml
    group: DATA
    description: Falcon plus MedGemma with agreement adjudication, no rule prior
