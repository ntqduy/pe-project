  # ----------------------------------------------------------- ZERO-SHOT
  diag.zeroshot.penet:
    config: configs/runs/01_foundation/zero_shot/penet.yaml
    group: FOUNDATION
    description: Released PENet applied unchanged, no training
    question: How far does an off-the-shelf CTPA PE model get before any adaptation?
    representation: none (external pretrained)
    task: diagnosis
    modalities: [image]
    anatomy: false
    supervision: none
    fusion: none
    runner: tools/tasks/zeroshot_penet.py
    requires:
      - what: Diagnosis manifest with pe_present
        experiment: data.dataset.full_inspect
        path_key: data.manifest
      - what: Raw release NIfTI under <PE_RAW_INSPECT_ROOT>/CT/full/CTPA
        path_key: penet.release_root
    produces: [the external zero-shot reference every in-house imaging arm must beat]
    status: ready

  diag.zeroshot.radar:
    config: configs/runs/01_foundation/zero_shot/radar.yaml
    group: FOUNDATION
    description: Released RADAR (abdominal-CT generalist) probed for PE, no training
    question: Does a CT vision-language generalist recognise PE on CTPA without adaptation?
    representation: none (external pretrained, pulmonary-artery organ token vs text pair)
    task: diagnosis
    modalities: [image]
    anatomy: false
    supervision: none
    fusion: none
    runner: tools/tasks/zeroshot_radar.py
    requires:
