      - what: Staged CT-FM feature-extractor weights (third_party/versions.yaml)
        path_key: model.checkpoint
      - what: Anatomy masks
        experiment: data.segmentation
        path_key: supervision.masks
      - what: ROI manifest supplying the heart/PA/lung branch masks
        experiment: data.roi
        path_key: data.roi_manifest
    produces: [PR_ctfm_anatomy_concat checkpoint, validation/test metrics and predictions]
    status: ready

  foundation.ct_fm_frozen.anatomy_moe.prognosis:
    config: configs/runs/01_foundation/ct_fm_frozen/anatomy_prognosis_moe.yaml
    group: FOUNDATION
    description: "CT-FM frozen + trainable organ adapters + Soft-MoE fusion for image-only prognosis"
    question: Does a Soft-MoE router over frozen CT-FM organ features beat concatenation for prognosis?
    representation: frozen public CT-FM (cached features)
    task: prognosis
    modalities: [image]
    anatomy: true
