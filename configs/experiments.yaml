  foundation.ct_fm_frozen.anatomy_concat.diagnosis:
    config: configs/runs/01_foundation/ct_fm_frozen/anatomy_diagnosis_concat.yaml
    group: FOUNDATION
    description: "CT-FM frozen + trainable organ adapters + concatenation fusion for diagnosis"
