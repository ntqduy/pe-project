    group: DIAGNOSIS
    description: Anatomy branches with accepted-silver organ heads, concatenation fusion
    question: Does supervising each organ branch with its own silver findings improve PE diagnosis?
    representation: public backbone
    task: diagnosis
    modalities: [image]
    anatomy: true
    supervision: native PE plus accepted silver on organ branches
    fusion: concat_mlp
    requires:
      - what: Diagnosis manifest with patient-level split
        experiment: data.dataset.full_inspect
        path_key: data.manifest
      - what: Anatomy masks
        experiment: data.segmentation
        path_key: supervision.masks
      - what: ROI manifest supplying the heart/PA/lung branch masks
        experiment: data.roi
        path_key: data.roi_manifest
