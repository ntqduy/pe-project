# Encoder checkpoint sources and named initialization selections.
# Select a fragment with: path/to/encoders.yaml#<preset>
_presets_:
  sources:
    # Where the encoder weights come from. The only source is `pretrained`: the original
    # public backbone weights, loaded through the backbone contract (backbones.yaml#registry).
    # A run never starts from another task's checkpoint.
    encoder:
      # Defaults to the run's model.backbone; set it to move backbone and weights together.
      backbone: null
      init_source: null
      checkpoint: null
      source_experiment: null
      sources:
        pretrained: null

  from_pretrained:
    # Start from the original public backbone weights — no adaptation of any kind.
    #
    # Every baseline arm (diagnosis and prognosis).
    _base_:
      - encoders.yaml#sources
    encoder:
      init_source: pretrained
    experiment:
      baseline_init: pretrained
