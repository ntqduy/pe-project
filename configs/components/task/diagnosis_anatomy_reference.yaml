# The anatomy-aware reference architecture and data contract (diag.anatomy.concat / DX18).
#
# Shared by the reference model itself, by every counterfactual removal run, and by every
# ROI-only student. This is not cosmetic: a counterfactual run loads the reference
# checkpoint strictly and a distilled student builds its teacher from its own config, so an
# architectural difference here breaks checkpoint loading instead of silently changing science.
data:
  mode: full
  manifest: manifests/diagnosis.csv
  file_column: image_path
  label_columns: [pe_present]
  # Anatomy masks come from the stored ROI run, not from manifest columns; see
  # components/data/anatomy_masks.yaml for the ROI ids and the reasoning.
  roi_manifest: roi/ROI_anatomy_and_controls/manifest.parquet
  roi_mask_ids:
    heart: ROI2
    pa: ROI4
    lung: ROI6
task:
  targets:
    _replace_: true
    pe_present: 1
  regions: [heart, pa, lung]
  silver_targets: []
  silver_loss_weight: 0.0
supervision:
  require_masks: true
  masks: segmentation/SEG_pseudo_anatomy
  require_rois: true
  rois: roi/ROI_anatomy_and_controls
  require_silver_labels: false
  silver_labels: null
