task:
  primary_target: mortality_30d
  modalities: [image, ehr, pesi]
  regions: [heart, pa, lung]
  ehr_input_dim: 32
  ehr_hidden_dim: 64
  ehr_output_dim: 64
  pesi_input_dim: 2
  pesi_hidden_dim: 16
  pesi_output_dim: 32
  expert_dim: 128
  hidden_dim: 256
  ehr_include_missingness: true
clinical_preprocessing:
  fit_split: train
  normalization: zscore
  imputation: mean
