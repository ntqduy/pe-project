# Feature and decision fusion strategies.
# Select a fragment with: path/to/fusions.yaml#<preset>
_presets_:
  concat_mlp:
    # Feature-level fusion: concatenate every available named branch, then one MLP.
    # Branches are masked before concatenation, so a missing branch contributes zeros.
    # Diagnosis branches: global (+ heart/pa/lung when task.regions is non-empty).
    # Prognosis branches: the image branches plus ehr/pesi when those modalities are enabled.
    fusion:
      type: concat_mlp
      dropout: 0.0
    task:
      architecture: concat_mlp

  late_logit:
    # Logit-level late fusion: every branch gets its own head, and the branch logits are
    # averaged with masked, renormalized weights (source/components/fusion/late_logit.py).
    # learned: false keeps equal fixed weights; learned: true trains a softmax over branches.
    # Unavailable branches are dropped from the average instead of contributing zeros.
    fusion:
      type: late_logit
      learned: false
    task:
      architecture: late_logit

  soft_moe:
    # Router-weighted soft mixture-of-experts fusion over the named branches.
    # The router is masked and renormalized for unavailable branches.
    fusion:
      type: soft_moe
      temperature: 1.0
      dropout: 0.0
    task:
      architecture: soft_moe
