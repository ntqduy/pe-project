silver:
  method: SL02
  # Written by data.dataset.<profile> as CSV; read_rows also accepts .parquet/.jsonl.
  reports: reports.csv
  confidence_threshold: 0.8
  falcon:
    # Informational label only; the actual model is selected by model_path/model_id
    # and provider_factory below, so swapping models never requires a code change.
    provider: falcon
    model_path: third_party/weights/falcon-7b
    # Exact revision and architecture: third_party/versions.yaml (components.falcon).
    model_id: tiiuae/falcon-7b
    provider_factory: source.silver.providers:build_transformers_provider
    provider_kwargs:
      auto_model_class: AutoModelForCausalLM
      tokenizer_class: AutoTokenizer
      device_map: auto
      torch_dtype: bfloat16
      local_files_only: true
  medgemma:
    # provider: medgemma | gemma4 | ... - informational; swap the LLM by changing
    # model_path/model_id/provider_kwargs, never by hardcoding it in training code.
    provider: medgemma
    model_path: third_party/weights/medgemma
    # Exact revision and architecture: third_party/versions.yaml (components.medgemma).
    model_id: google/medgemma-1.5-4b-it
    provider_factory: source.silver.providers:build_transformers_provider
    provider_kwargs:
      # The staged checkpoint declares Gemma3ForConditionalGeneration (see
      # third_party/versions.yaml), which AutoModelForCausalLM does not resolve.
      # Report mining is text-only, so AutoTokenizer is still the right input path.
      auto_model_class: AutoModelForImageTextToText
      tokenizer_class: AutoTokenizer
      device_map: auto
      torch_dtype: bfloat16
      local_files_only: true
