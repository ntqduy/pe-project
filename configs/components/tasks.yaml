# Task, cohort, and supervision contracts.
# Select a fragment with: path/to/tasks.yaml#<preset>
_presets_:
  diagnosis:
    task:
      primary_target: pe_present
      targets:
        pe_present: 1
        acuity: 4
        central: 1
        lobar: 1
        segmental: 1
        subsegmental: 1
        saddle: 1
        rv_enlargement: 1
        rv_lv_abnormal: 1
        septal_bowing: 1
        reflux: 1
        pleural_effusion: 1
        pericardial_effusion: 1
        chronic_lung_disease: 1
      regions: [heart, pa, lung]
      architecture: soft_moe
      expert_dim: 128
      hidden_dim: 256
      silver_targets: [acuity, central, lobar, segmental, subsegmental, saddle, rv_enlargement, rv_lv_abnormal, septal_bowing, reflux, pleural_effusion, pericardial_effusion, chronic_lung_disease]
      silver_loss_weight: 0.2

  diagnosis_anatomy_reference:
    # The anatomy-aware reference architecture and data contract (diag.anatomy.concat / DX18).
    #
    # Shared by the reference model itself and by every counterfactual removal run. This is not
    # cosmetic: a counterfactual run loads the reference checkpoint strictly, so an
    # architectural difference here breaks checkpoint loading instead of silently changing science.
    data:
      mode: full
      manifest: manifests/diagnosis.csv
      file_column: image_path
      label_columns: [pe_present]
      # Anatomy masks come from the stored ROI run, not from manifest columns; see
      # components/anatomy.yaml#anatomy_masks for the ROI ids and the reasoning.
      roi_manifest: roi/ROI_anatomy_and_controls/roi_manifest.csv
      roi_mask_ids:
        heart: ROI2
        pa: ROI4
        lung: ROI6
    task:
      targets:
        _replace_: true
        pe_present: 1
      regions: [heart, pa, lung]
      silver_targets: []
      silver_loss_weight: 0.0
    supervision:
      require_masks: true
      masks: segmentation/SEG_pseudo_anatomy
      require_rois: true
      rois: roi/ROI_anatomy_and_controls
      require_silver_labels: false
      silver_labels: null

  diagnosis_organ_silver:
    # Organ-branch auxiliary heads supervised by ACCEPTED silver labels.
    #
    # Each auxiliary target is attached to the organ branch whose anatomy it describes, so the
    # gradient reaches the branch that should encode it. Target names are the canonical silver
    # schema names (source/silver/schema.py), which intentionally differ from some native column
    # names (rv_lv_ratio_abnormal vs rv_lv_abnormal, contrast_reflux vs reflux).
    # Preflight rejects any auxiliary target that has no configured supervision source.
    task:
      auxiliary_default_source: silver
      auxiliary_targets:
        heart:
          rv_enlargement: {type: binary, source: silver}
          rv_lv_ratio_abnormal: {type: binary, source: silver}
          septal_bowing: {type: binary, source: silver}
          contrast_reflux: {type: binary, source: silver}
          pericardial_effusion: {type: binary, source: silver}
        pa:
          acuity: {type: multiclass, classes: 4, source: silver}
          central: {type: binary, source: silver}
          lobar: {type: binary, source: silver}
          segmental: {type: binary, source: silver}
          subsegmental: {type: binary, source: silver}
          saddle: {type: binary, source: silver}
        lung:
          pleural_effusion: {type: binary, source: silver}
          chronic_lung_disease: {type: binary, source: silver}
          fibrosis: {type: binary, source: silver}
          emphysema: {type: binary, source: silver}
      auxiliary_organ_weights:
        heart: 0.2
        pa: 0.2
        lung: 0.2
      # Silver supervision reaches the model only through the organ auxiliary heads above, so
      # the main-head silver term stays off and auxiliary_organ_weights is the effective weight.
      silver_loss_weight: 0.0
      silver_targets:
        [rv_enlargement, rv_lv_ratio_abnormal, septal_bowing, contrast_reflux,
         pericardial_effusion, acuity, central, lobar, segmental, subsegmental,
         saddle, pleural_effusion, chronic_lung_disease, fibrosis, emphysema]

  prognosis:
    task:
      primary_target: mortality_30d
      modalities: [image, ehr, spesi]
      regions: [heart, pa, lung]
      ehr_input_dim: 32
      ehr_hidden_dim: 64
      ehr_output_dim: 64
      # sPESI is one ordinal 0-6 score; its missingness is carried beside it.
      spesi_input_dim: 1
      spesi_hidden_dim: 16
      spesi_output_dim: 32
      expert_dim: 128
      hidden_dim: 256
      ehr_include_missingness: true
    clinical_preprocessing:
      fit_split: train
      normalization: zscore
      imputation: mean

  prognosis_primary_cohort:
    # Primary prognosis cohort contract: confirmed acute PE, 30-day mortality.
    #
    # Every 03_prognosis run inherits this one data contract, so the modality ablation and the
    # fusion comparison are measured on exactly the same patients, split and columns. Fill the
    # real column names here once and every prognosis arm picks them up.
    #
    # BLOCKERS (deliberate empty placeholders — never guess these):
    #   ehr_columns        the EHR variables actually fed to the clinical encoder; its length
    #                      must equal task.ehr_input_dim (32) or preflight fails
    #   ehr_columns_full   every configured EHR variable
    #   ehr_columns_common the dataset-defined high-availability subset of ehr_columns_full
    #                      (preflight fails if it is not a subset)
    # spesi_columns is NOT a blocker: stage 0 writes the column itself.
    data:
      mode: full
      cohort: confirmed_acute_pe
      manifest: manifests/prognosis.csv
      file_column: image_path
      label_columns: [mortality_30d]
      # Legacy prognosis configs read the strict pre-index profile. Matrix launchers may
      # switch this to EHR_24_h, whose definition is audited in clinical/ehr_profiles.json.
      ehr_profile: EHR_0_h
      ehr_columns: []
      ehr_columns_full: []
      ehr_columns_common: []
      spesi_columns: [spesi]
      spesi_availability_column: has_spesi
