# Silver-label generation methods.
# Select a fragment with: path/to/silver.yaml#<preset>
#
# MedGemma is the silver labeller: it answers every target first, and a low-confidence
# answer abstains rather than guessing. With rule_rescue the explicit regex extractor only
# backs it up (veto on explicit contradiction, value when MedGemma abstains or fails);
# accepted rows name their source (medgemma or rule).
# Logic: source/silver/generator.py.
#
# The regex extractor is source/silver/rules.py (RULE_VERSION pe_rules_v2);
# analysis/run_eda.py also reports how many targets it could settle on its own.
_presets_:

  # ---- shared pieces; not runnable on their own ----

  reports_input:
    silver:
      # Written by data.dataset.<profile> as CSV; read_rows also accepts .parquet/.jsonl.
      reports: manifests/reports.csv
      # v2: explicit true/false/null rules, "no PE" rules out every PE location, JSON example,
      # verbatim evidence. Changing it re-labels cached reports on the next run.
      prompt_version: v2
      # The regex extractor (source/silver/rules.py) backs MedGemma up: it vetoes a confident
      # MedGemma value it explicitly contradicts, and supplies the value when MedGemma
      # abstains/fails but the report states the finding (rows with source=rule).
      rule_rescue: true
      # PE hierarchy per report: pe_present=false makes every PE location false (and
      # withdraws acuity); a location "false" without a pe_present decision abstains.
      pe_consistency: true
      # Provider confidence is confidence in the returned class/value, not a calibrated
      # probability of PE. Every model decision is threshold-gated; validation calibration
      # metadata must be supplied before reporting clinical performance.
      confidence_threshold: 0.8
      medgemma_confidence_threshold: 0.8
      agreement_confidence_threshold: 0.6
      threshold_calibration:
        split: validation
        method: fixed_pending_validation_calibration
        artifact: null

  medgemma_model:
    silver:
      medgemma:
        # provider: medgemma | gemma4 | ... - informational, same as falcon.provider.
        provider: medgemma
        model_path: third_party/weights/medgemma
        # Exact revision and architecture: third_party/versions.yaml (components.medgemma).
        model_id: google/medgemma-1.5-4b-it
        provider_factory: source.silver.providers:build_transformers_provider
        provider_kwargs:
          # The staged checkpoint declares Gemma3ForConditionalGeneration (see
          # third_party/versions.yaml), which AutoModelForCausalLM does not resolve.
          # Report mining is text-only, so AutoTokenizer is still the right input path:
          # no CT volume is ever passed to MedGemma by this stage.
          auto_model_class: AutoModelForImageTextToText
          tokenizer_class: AutoTokenizer
          device_map: auto
          torch_dtype: bfloat16
          local_files_only: true
          max_new_tokens: 384
        # One corrective re-ask when an answer is not usable JSON / not a legal value.
        retries: 1

  # ---- the one generation method ----

  medgemma:
    _base_:
      - silver.yaml#reports_input
      - silver.yaml#medgemma_model
    silver:
      method: medgemma
