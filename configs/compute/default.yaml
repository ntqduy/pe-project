compute:
  accelerator: cuda
  # auto: [] -> CPU, [0] -> one GPU, [0, 1, ...] -> distributed execution.
  strategy: auto
  devices: [0]
  num_nodes: 1
  precision: bf16
  distributed_backend: nccl
  # Four workers matches the current project host and avoids DataLoader oversubscription.
  # Override per run with NUM_WORKERS=<n> in scripts/tool/run_ctfm_frozen.sh.
  num_workers: 4
