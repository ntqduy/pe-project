# Data and output roots.
#
# Everything the pipeline writes lives under /mnt/pe-project/outputs (git-ignored, on the VM
# disk), laid out like gs://pe-study/pe-storage so `gcloud storage rsync` can mirror it:
#
#   derived/datasets/<profile>/   cohorts: manifests, dataset.json, data_quality.md
#   derived/cache/<profile>/      preprocessed volumes, CT-FM features, clinical tables
#   pe-project/outputs/<stage>/   every run
#
# The raw INSPECT release is only read, from the gcsfuse mount /mnt/Stanford_INSPECT_dataset.
# PE_RAW_INSPECT_ROOT and PE_DERIVED_ROOT, when exported, still override the two input-side
# roots (source/data/paths.py); nothing needs to be exported for these defaults.
paths:
  cloud_root: /mnt/pe-project/outputs
  cloud_project_root: /mnt/pe-project/outputs/pe-project
  data_root: /mnt/pe-project/outputs/data
  raw_inspect: /mnt/Stanford_INSPECT_dataset
  derived_data: /mnt/pe-project/outputs/derived
  output_root: /mnt/pe-project/outputs/pe-project/outputs
