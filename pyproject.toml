[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pe-project"
version = "0.1.0"
description = "Reproducible 3D CTPA representation-learning research framework"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "pyarrow>=14",
  "PyYAML>=6.0",
  "scikit-learn>=1.3",
  "scipy>=1.11",
  "torch>=2.2",
  "nibabel>=5.2",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
training = [
  "torchvision>=0.17",
  "SimpleITK>=2.3",
  "monai>=1.3",
  "transformers>=4.44",
  "accelerate>=0.33",
  "huggingface-hub>=0.24",
  "safetensors>=0.4",
  "einops>=0.7",
  "sentencepiece>=0.2",
]
segmentation = [
  "pydicom>=2.4",
  "scikit-image>=0.26",
  "fill-voids>=2.0",
  "more-itertools>=10",
  "tqdm>=4.66",
]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[tool.setuptools.packages.find]
include = ["source*", "tools*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"

.claude/
