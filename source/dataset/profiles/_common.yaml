# Shared cohort contract for every active dataset profile.
#
# THIS FILE IS THE REASON test_500_sample AND full_inspect ARE COMPARABLE.
# Filtering, CT integrity, label adjudication, manifest construction and volume
# preprocessing are defined once, here. A profile may add a `sampling` block; a profile
# that changes anything below makes its results incomparable with the other profile, and
# `source.dataset.assert_shared_preprocessing()` will refuse it.

source:
  # <raw_inspect>/<modality>/<release>; the raw release is READ-ONLY.
  modality: CT
  release: full
  volume_suffix: .nii.gz

governance:
  # Repeatable CSV/TSV of person_id / patient_id to drop before any study-level rule,
  # so a governance-excluded patient is never partially present.
  exclude_patients_from: []

eligibility:
  # Set false for a metadata-only pass when the volumes are not mounted.
  check_files: true
  rules:
    require_ct_file: true
    require_report: true
    require_labels: true
    require_series_metadata: true
    # The EHR crosswalk is required by the prognosis arms, not by the cohort itself.
    require_ehr_crosswalk: false
    allowed_modalities: [CT]
    # Noise removal. Thresholds are configuration, not constants: these defaults come
    # from the /mnt/pe_study readiness buckets (num_slices <=1, SliceThickness >3mm,
    # PixelSpacing >1mm were the review buckets) widened to the acquisition limits that
    # are indefensible rather than merely unusual. Every drop lands in audit/exclusions.csv.
    minimum_slices: 2
    maximum_slices: null
    minimum_slice_thickness_mm: null
    maximum_slice_thickness_mm: 5.0
    minimum_pixel_spacing_mm: null
    maximum_pixel_spacing_mm: 2.0

integrity:
  # path   file exists and is non-trivially sized      (metadata speed)
  # header NIfTI header parses, plausible 3-D geometry  (default; ~ms per study)
  # volume voxels decode and are finite                 (slow; opt in for a full audit)
  level: header
  limit: null
  minimum_slices: 2

adjudication:
  # Reduced per patient with TRUE > CENSORED > FALSE > MISSING precedence.
  columns:
    - pe_positive_nlp
    - pe_acute
    - pe_subsegmentalonly
    - 1_month_mortality
    - 6_month_mortality
    - 12_month_mortality
    - 1_month_readmission
    - 6_month_readmission
    - 12_month_readmission
    - 12_month_PH

manifests:
  # INSPECT column -> project target. Only native labels appear here; every richer
  # attribute is silver-derived (SL00/SL01/SL02) and is never invented at build time.
  label_map:
    pe_positive_nlp: pe_present
    pe_acute: pe_acute
    pe_subsegmentalonly: pe_subsegmental_only
  # New protocol-facing aliases coexist with the legacy diagnosis column names above.
  # They point at the same raw reviewed labels; no label is inferred or duplicated by
  # model code.
  diagnosis_label_aliases:
    pe_positive: pe_positive_nlp
    pe_subsegmental: pe_subsegmentalonly
  prognosis_label: 1_month_mortality
  prognosis_conditions:
    pe_positive_nlp: TRUE
    pe_acute: TRUE
  # The legacy prognosis.csv remains confirmed acute PE for backward compatibility.
  # New matrix runs read one of these explicit evaluation cohorts instead.  Cohort and
  # EHR window are data-selection/input settings, never additional prediction labels.
  prognosis_outcomes:
    - 1_month_mortality
    - 6_month_mortality
    - 12_month_mortality
    - 1_month_readmission
    - 6_month_readmission
    - 12_month_readmission
    - 12_month_PH
  prognosis_cohorts:
    all_patient:
      manifest: prognosis_all_patient.csv
      conditions: {}
    PE_positive:
      manifest: prognosis_pe_positive.csv
      conditions:
        pe_positive_nlp: TRUE
  include_report_text: true

preprocessing:
  # IDENTICAL FOR EVERY PROFILE.  Changing anything here invalidates every cache and
  # checkpoint; the complete contract hash is stamped into dataset.json and each
  # volume sidecar.  This is a dense-model cache, not a replacement for raw NIfTI.
  target_shape: [128, 128, 128]
  clip_min_hu: -1000.0
  clip_max_hu: 1000.0
  normalize: minmax
  dtype: float32
  orientation: RAS
  # Geometry is canonicalised in physical space before body cropping.  `fit` then
  # retains the whole cropped field of view in the fixed tensor instead of silently
  # discarding superior/inferior or peripheral anatomy with a centre crop.
  resample_spacing_mm: [1.5, 1.5, 1.5]
  foreground_strategy: external_body
  foreground_threshold_hu: -900.0
  foreground_margin_mm: 10.0
  spatial_strategy: fit
  output_format: npy
  # The dense model does not consume these patches yet, but persisting the complete
  # world-coordinate grid makes future MIL/CT-FM work traceable to this exact cache.
  emit_patch_grid: true
  patch_shape: [64, 64, 64]
  patch_overlap: 0.5

# Validate every written or reused cache entry before it reaches a manifest. The detailed
# findings are under audit/cache_qc.json; the aggregate count appears in data_quality.md.
cache_qc:
  enabled: true
  limit: null

# EHR readiness is part of the stage-0 gate. It materializes the raw MEDS/OMOP archive
# into the local cache, then writes a patient-linked, pre-CTPA utilization feature table
# and an aggregate leakage/missingness audit under each profile's clinical/ directory.
# The raw event archive is never copied into the dataset profile or a manifest.
ehr:
  enabled: true
  archive: meds_omop_inspect.tar.gz
  cache_namespace: inspect_meds_omop
  batch_size: 250000
  end_before_ctpa_hours: 0.0
  # EHR_0_h means strict pre-index: event_time < CTPA time. EHR_24_h means a
  # stricter 24-hour *pre-CTPA safety buffer*: event_time < CTPA time - 24h. It never
  # admits post-index EHR events, so neither profile can leak a later prognosis outcome.
  default_profile: EHR_0_h
  profiles:
    EHR_0_h:
      end_before_ctpa_hours: 0.0
      manifest_prefix: ""
    EHR_24_h:
      end_before_ctpa_hours: 24.0
      manifest_prefix: ehr_24h_
  windows_days: [365, 30]
  train_vocabulary:
    prior: 1000
    window365: 500
    window30: 500
  prohibited_config: configs/clinical/ehr_prohibited_features.json

# Stage 0 audits PESI candidates against the INSPECT codebook. It only writes score
# columns after every component has clinical approval *and* an approved study-level
# component table is supplied. Until then it writes a blocked, reviewable status rather
# than manufacturing a plausible score from pattern-matched events.
pesi:
  enabled: true
  mapping_config: configs/clinical/pesi_spesi_mapping.yaml
  # Aggregate (no patient IDs/values) audit of candidate code availability, units and
  # pre-CTPA timing. This runs even while scoring remains blocked.
  audit_candidate_coverage: true
  audit_batch_size: 250000
  # Write raw candidate component values, per-component missingness, source code, unit
  # and timestamp to clinical/pesi_components_candidate.csv. This supports learned
  # clinical models without treating candidate mappings as an approved PESI score.
  materialize_candidate_components: true
  # Fill with an approved, study-level table only after the mapping audit is approved.
  # An absolute path under /mnt/pe-storage is appropriate; leaving it null keeps PESI
  # safely blocked while the rest of stage 0 is fully runnable.
  components_table: null
  required_columns: [pesi, spesi]
