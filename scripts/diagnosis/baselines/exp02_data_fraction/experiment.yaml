# exp02_data_fraction - the case grid of this experiment (see ../exp01_baselines/experiment.yaml).
# Only the TRAIN patients are subsampled (stratified by label, nested 25 c 50 c 75 c 100);
# validation and the official test split never change (source/data/experiment_splits.py).
title: "Training-set size: 25 / 50 / 75 / 100% (MLP head)"
models:
  - resnet18_3d
  - convnext_3d
  - vit_3d
  - swin_3d
  - nnmamba_3d
  - vmamba_3d
  - ctfm_lora_3d
  - ctfm_frozen_3d
heads: [mlp]
fractions: [25, 50, 75, 100]
overrides: {}
